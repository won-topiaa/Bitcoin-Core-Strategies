# 화면 문자열의 영어 판.
#
# strategy.yaml 은 점수를 만드는 설정이다. 거기에 영어를 나란히 얹으면 680줄이
# 1,200줄이 되고, 임계값을 고치러 들어간 사람이 산문 사이를 헤매게 된다.
# 그래서 언어만 따로 뺐다.
#
# **위험은 어긋남이다.** 지표를 하나 추가하고 여기를 잊으면 영어 화면에
# 한국어가 섞인다. tests/test_i18n.py 가 키 집합이 정확히 일치하는지 검사한다 —
# 빠진 것도, 남는 것도 실패로 잡는다.
#
# 키 구조는 strategy.yaml 을 그대로 따른다.

indicators:

  mvrv_z:
    label: "MVRV Z-Score"
    explain: "How far today's value sits above what the whole market paid on average"
    explain_long: >-
      Treat every coin in every wallet as remembering the price on the day it last moved, and add all
      those prices up — that total is what the market as a whole paid. When market cap opens up a wide
      gap above that cost basis, it means holders are sitting on large unrealised gains, and that state
      has never lasted long. The Z part restates the size of the gap as "how many times the usual
      spread is this, historically".

  nupl:
    label: "NUPL"
    explain: "What percentage of market cap is unrealised profit"
    explain_long: >-
      Same raw material as MVRV, divided differently. A reading of 0.75 means 75 percent of market cap
      is profit nobody has sold yet. Because the measure is capped at 1.0 on the upside, its peak
      readings fade from cycle to cycle less than the other indicators do.

  thermocap:
    label: "Thermocap multiple (market cap ÷ cumulative miner revenue)"
    explain: "How many times market cap covers everything ever paid to miners"
    explain_long: >-
      Add up every dollar miners have earned since the day Bitcoin started — that is thermocap. Think
      of it as the cumulative cost of building this network. The indicator asks how many times over
      market cap covers that cost. Because the denominator only ever accumulates and never shrinks,
      it moves more slowly than the others, and is correspondingly steadier.

  pi_cycle:
    label: "Pi Cycle proximity (111DMA ÷ 350DMA×2)"
    explain: "How close the short moving average is to twice the long one"
    explain_long: >-
      The days when the 111-day average crossed above twice the 350-day average landed within days of
      three past major peaks. The closer to 1.0, the closer to that crossing. Note, though, that the
      crossing did not happen at all in the last two cycles — the spread between the averages keeps
      narrowing from cycle to cycle.

  grm:
    label: "Golden Ratio multiple (price ÷ 350DMA)"
    explain: "How many times the 350-day average today's price is"
    explain_long: >-
      The number 350 comes with a story about the golden ratio attached, but what it actually does is
      simple: "how many times a just-under-a-year average is the price right now". Whatever its
      origin, it is a serviceable read on how hot things have run over the medium term.

  ma200w_mult:
    label: "200-week MA multiple (price ÷ 200WMA)"
    explain: "How many times the 200-week (about four-year) average today's price is"
    explain_long: >-
      Four years is one halving cycle. Across Bitcoin's history, price has spent less than 5 percent
      of all days below this line, and every one of those stretches was near a bottom. A reading of
      1.0 means price is sitting exactly on the line. This line also sets the reference floor prices,
      not just the score.

  ma2y_mult:
    label: "2-year MA multiple (Bitcoin Investor Tool)"
    explain: "How many times the two-year average today's price is"
    explain_long: >-
      Shorter than 200 weeks, longer than 350 days. It fills the gap for when the 200-week line moves
      too slowly and the 350-day line wobbles too often. Same raw material as the indicator known as
      the Bitcoin Investor Tool.

  puell:
    label: "Puell Multiple (issuance in USD ÷ four-year average)"
    explain: "How many times their usual take miners earned today"
    explain_long: >-
      Multiply the coins newly issued in a day by that day's price and you get the miners' daily
      revenue. Divide it by its own four-year average. A high reading means mining is unusually
      profitable, and those stretches have generally sat near price peaks. The baseline is four years
      rather than the more common one year for a reason: over one year the halving effect cancels out,
      which quietly turns this into another price indicator.

  hash_ribbons:
    label: "Hash Ribbons state"
    explain: "Whether miners are currently under strain"
    explain_long: >-
      When the 30-day average of hashrate (the network's total mining computation) falls below the
      60-day average, it means more machines are being switched off. The shape of that state deepening
      and then recovering has shown up at every past bottom. This is the only one of the nine read as
      a state rather than a number.

families:

  valuation:
    label: "Against cost basis"
    explain: >-
      This family is about what you divide market cap by. Divide by what the market paid and you get
      MVRV and NUPL; divide by the cumulative cost of mining and you get thermocap. All three share
      raw material, so rather than adding them up we take whichever is most extreme at the time.

  price:
    label: "Against average price"
    explain: >-
      All of these are variations on "price now ÷ the average price over some period". Only the period
      differs (111 days, 350 days, 2 years, 200 weeks). Since the raw material is the same, we average
      them. This family alone is deliberately blocked from opening any action: late in a bull market
      four price averages turning red at once is not four confirmations, it is the same fact seen four
      times.

  supply:
    label: "Mining conditions"
    explain: >-
      This looks at the side that produces the coins — how profitable mining is, and whether miners
      are powering machines down. It is the only family that does not use price or market cap
      directly, which is why it overlaps least with the other two.

bands:
  euphoria:      {label: "Ceiling",        stance: "Sell down faster"}
  distribution:  {label: "Near a peak",    stance: "Start selling down"}
  upper_neutral: {label: "Expensive side", stance: "No new buys, keep the standing contribution"}
  neutral:       {label: "Middle",         stance: "Contribute as usual"}
  accumulation:  {label: "Cheap side",     stance: "Raise the contribution"}
  deep_value:    {label: "Near a bottom",  stance: "Start deploying reserve cash"}
  capitulation:  {label: "Floor",          stance: "Deploy reserve cash heavily"}

# 숫자가 아니라 상태를 내는 것들. 키는 strategy.yaml 의 해당 states 와 같아야 한다.
# (Hash Ribbons = BCS 지표, 연준 스탠스 = LRS 구성요소)
states:
  recovery: "recovering"
  capitulation: "miners leaving"
  normal: "normal"
  expansion: "mining expanding"

# 연준 스탠스(LRS 구성요소)의 영어 이름은 여기 두지 않는다. 읽는 곳이 없다 —
# 사이트는 LRS 중 m2_impulse 하나만 싣고, 그 상태 이름을 화면에 찍지 않는다.
# 터미널 리포트(src/btc_core/report.py)는 한국어 전용이라 config/strategy.yaml 의
# state_labels 를 그대로 쓴다. 예전에는 여기에 lrs_states 블록이 있었지만 어떤
# 코드도 읽지 않아, 번역이 갖춰진 것처럼 보이기만 하고 실제로는 아무 데도 안
# 닿았다. LRS 상태를 영어 화면에 띄우게 되면 그때 이 자리에 다시 넣고,
# tools/export_viz.py 의 states_en 과 tests/test_i18n.py 에 함께 이어야 한다.
