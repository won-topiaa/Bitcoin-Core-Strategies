# ---------------------------------------------------------------------------
# BCS — Bitcoin Cycle Score / LRS — Liquidity Regime Score
#
# 이 파일 하나가 전략의 단일 진실 공급원(single source of truth)이다.
# 코드에는 임계값을 하드코딩하지 않는다. 생각이 바뀌면 여기만 고친다.
#
# 근거 문서: docs/01-핵심-추출.md, docs/02-핵심지표-정의.md, docs/03-스코어-엔진.md
# ---------------------------------------------------------------------------

meta:
  name: "BCS/LRS — 나만의 비트코인 핵심 지표"
  version: "1.0.0"
  # 원문 12개 지표를 4개 독립 계열(BCS) + 1개 거시 축(LRS) + 3개 바닥선으로 압축했다.
  # 압축 원칙: "계산 재료가 같으면 한 개로 센다" (원문 6.1)

# ===========================================================================
# 1. 정규화 — 원시값 → [-1, +1]
#    -1 = 극단 저평가/항복,  0 = 중립,  +1 = 극단 과열
#    anchors 는 (원시값, 정규화값) 꺾은선. 사이 값은 선형보간, 바깥은 클램프.
# ===========================================================================
indicators:

  # --- 밸류에이션 계열 -----------------------------------------------------
  mvrv_z:
    label: "MVRV Z-Score"
    family: valuation
    source: auto            # 시총·실현시총에서 계산 가능
    unit: "z"
    # 실측 사이클 최대값: 2013=10.66 / 2017=10.09 / 2021=7.15 / 2025=3.35
    # 저점은 안정적: 2011=-0.59 / 2015=-0.60 / 2018=-0.49 / 2022=-0.32
    # 상단은 2025 사이클 최대(3.35)가 +0.90 이 되도록, 하단은 검증된 값 유지.
    anchors:
      - [-0.50, -1.00]
      - [ 0.00, -0.75]
      - [ 0.50, -0.50]
      - [ 1.00, -0.25]
      - [ 1.50,  0.00]
      - [ 2.00,  0.30]
      - [ 2.50,  0.55]
      - [ 3.00,  0.75]
      - [ 3.50,  0.90]
      - [ 5.00,  1.00]

  nupl:
    label: "NUPL"
    family: valuation
    source: auto
    unit: "ratio"
    # 실측 사이클 최대값: 2013=0.83 / 2017=0.79 / 2021=0.75 / 2025=0.64
    # 감쇠율 -23% 로 7개 지표 중 가장 완만하다. 비율이라 위가 1.0 으로 막혀 있어서다.
    # 원문 3.4 의 구간 경계(0.75 도취 / 0 항복)는 그대로 두되 상단만 당겼다.
    anchors:
      - [-0.25, -1.00]
      - [ 0.00, -0.75]
      - [ 0.15, -0.45]
      - [ 0.25, -0.28]
      - [ 0.35,  0.00]
      - [ 0.45,  0.30]
      - [ 0.55,  0.60]
      - [ 0.62,  0.80]
      - [ 0.70,  0.92]
      - [ 0.80,  1.00]

  thermocap:
    label: "서멀캡 배수 (시가총액 ÷ 누적 채굴수익)"
    family: valuation
    source: auto
    unit: "x"
    # 2026-07-28 선별 검정으로 편입. tools/screen_indicator.py 결과:
    #   2020년 이후 ρ(2년) -0.92, 사분위 분리도 -256%p — 측정한 지표 중 최강.
    #   기존 지표와의 순위상관은 +0.69~+0.77 로 부분 독립.
    #
    # **퍼센타일 전용이다.** 분모(누적 채굴수익)가 단조증가하고 반감기마다
    # 증가 속도가 느려져서 비율에 구조적 상승 추세가 있다. 사이클 저점 값이
    # 2.11(2015) → 5.57(2018) → 6.85(2022) → 13.88(현재) 로 계속 올라간다.
    # 고정 앵커는 의미가 없으므로 순위 정보만 쓴다.
    adaptive_weight: 1.0      # 퍼센타일 100%
    requires_history: true    # 이력이 없으면 결측 처리 (앵커 단독 사용 금지)
    # 아래 앵커는 형식상 필요할 뿐 점수에 영향을 주지 않는다.
    anchors:
      - [ 1.0, -1.00]
      - [10.0,  0.00]
      - [80.0,  1.00]
    #
    # 이 지표의 성격: 고점에 강하고 바닥에 약하다. 4년 퍼센타일 기준으로
    # 고점 평균 +0.86(전 지표 중 1위), 저점 평균 -0.56(꼴찌)이다.
    # 밸류에이션 계열의 집계가 max_abs 라 바닥에서의 약점은 무해하다 —
    # 더 극단인 MVRV Z 가 선택되고 이 지표는 무시된다.

  # --- 가격·추세 계열 ------------------------------------------------------
  pi_cycle:
    label: "Pi Cycle 근접도 (111DMA ÷ 350DMA×2)"
    family: price
    source: auto
    unit: "ratio"
    # 1.0 도달 = 교차 = 고점 경보. 그 자체가 매도 명령은 아니다(원문 3.1 주의).
    #
    # 실측 사이클 최대값: 2013=1.23 / 2017=1.06 / 2021=1.00 / 2025=0.74
    # 2025 사이클에서는 교차조차 하지 못했다. 원문 3.1 이 인용한 BM Pro 자체
    # 경고("ETF 이후 유효성 저하")가 데이터로 확인된 셈이다.
    # 가격이 평평하면 이 값은 정확히 0.50 이므로, 약세장에서는 늘 바닥값을 낸다.
    # 즉 지금의 Pi Cycle 은 고점 지표라기보다 사실상 약세장 지표에 가깝다.
    # 계열 평균(1/4) + 계열 가중치(25%) 로 최종 지분 6.25% 라 폐기까지는 않는다.
    anchors:
      - [0.50, -1.00]
      - [0.56, -0.55]
      - [0.62, -0.20]
      - [0.68,  0.20]
      - [0.74,  0.55]
      - [0.85,  0.85]
      - [1.00,  1.00]

  grm:
    label: "Golden Ratio 배수 (가격 ÷ 350DMA)"
    family: price
    source: auto
    unit: "x"
    # 원문 3.7 이 말한 고점 배수 하락(21→8→5→3→2)을 실측이 확인했다.
    # 사이클 최대값: 2013=11.91 / 2017=5.61 / 2021=3.66 / 2025=2.10
    anchors:
      - [0.60, -1.00]
      - [0.85, -0.60]
      - [1.00, -0.30]
      - [1.20,  0.00]
      - [1.45,  0.35]
      - [1.70,  0.60]
      - [2.00,  0.85]
      - [2.50,  0.95]
      - [3.50,  1.00]

  ma200w_mult:
    label: "200주 MA 배수 (가격 ÷ 200WMA)"
    family: price
    source: auto
    unit: "x"
    # 사이클 최대값: 2013=5.63 / 2017=16.28 / 2021=6.25 / 2025=2.51
    # 하단은 검증됨 — 2015/2018/2022 저점에서 0.91 / 1.00 / 0.66 을 찍었다.
    anchors:
      - [0.85, -1.00]
      - [1.00, -0.80]
      - [1.20, -0.50]
      - [1.50,  0.00]
      - [1.90,  0.40]
      - [2.30,  0.70]
      - [2.60,  0.88]
      - [3.50,  1.00]

  ma2y_mult:
    label: "2년 MA 배수 (Bitcoin Investor Tool)"
    family: price
    source: auto
    unit: "x"
    # 원문 4.3: 초록선(2Y MA) 아래 매집, 빨간선(×5) 근접 익절.
    # 사이클 최대값: 2013=17.96 / 2017=9.96 / 2021=4.88 / 2025=2.48
    # ×5 라는 익절선은 2013 사이클 기준이다. 2021 이후로는 한 번도 닿지 않았다.
    anchors:
      - [0.75, -1.00]
      - [1.00, -0.70]
      - [1.25, -0.35]
      - [1.55,  0.00]
      - [1.90,  0.35]
      - [2.20,  0.60]
      - [2.50,  0.85]
      - [3.20,  1.00]

  # --- 공급·채굴 계열 ------------------------------------------------------
  puell:
    label: "Puell Multiple (발행액 ÷ 4년 평균)"
    family: supply
    source: auto
    unit: "x"
    # **기준선이 365일이 아니라 1460일이다.** 원래 정의(365일)는 공급 지표가
    # 아니었다 — 반감기 사이 발행량이 일정해서 발행량이 약분되고 '가격 ÷
    # MA365(가격)'만 남는다. 실측으로 GRM 과 ρ +0.890 이었다. 즉 가격 지표가
    # 공급 계열의 옷을 입고 합의 게이트에서 '비가격 확인' 표를 행사하고 있었다.
    # 1460일은 반감기 간격(약 1458일)을 넘어 발행량이 창 안에서 반으로 줄므로
    # 약분이 일어나지 않는다. 근거와 대가는 docs/13 에 적었다.
    #
    # 아래 앵커는 1460일 기준선의 실측 분포로 다시 잡은 것이다.
    #   사이클 최대: 2013=4.74 / 2017=15.53 / 2021=4.49 / 2025=2.69
    #   사이클 최소: 0.78 / 0.69 / 0.39 / 0.61
    #   전 구간 분위: p05 0.77 / p25 1.00 / 중앙 1.37 / p75 2.01 / p95 3.92
    # 상단은 2025 사이클 최대(2.69)가 +0.90 이 되도록 잡았다 — 365일 기준선
    # 때와 같은 원칙이다(감쇠가 계속된다는 데 베팅하지 않고 마지막 사이클에 맞춘다).
    anchors:
      - [0.40, -1.00]
      - [0.65, -0.75]
      - [0.90, -0.35]
      - [1.35,  0.00]
      - [1.70,  0.25]
      - [2.05,  0.50]
      - [2.40,  0.72]
      - [2.70,  0.90]
      - [4.00,  1.00]

  hash_ribbons:
    label: "Hash Ribbons 상태"
    family: supply
    source: auto
    unit: "state"
    input_mode: categorical
    # 연속값이 아니라 상태 기계다. 채굴자 항복의 '끝'이 신호(원문 4.4).
    states:
      recovery:     -1.00   # 30일선이 60일선을 재돌파 → 가장 강한 매수 신호
      capitulation: -0.55   # 30일선 < 60일선 → 항복 진행 중, 아직 신호 아님
      normal:        0.00
      expansion:     0.30   # 해시레이트 급팽창 → 강세 후반 동행

# ===========================================================================
# 2. BCS — 사이클 위치 점수 (-100 극단 저평가 ~ +100 극단 과열)
#    거시는 여기 들어가지 않는다. 별도 축(LRS)이다. 이유는 docs/03 참조.
# ===========================================================================
bcs:
  families:
    valuation:
      label: "밸류에이션"
      weight: 40
      members: [mvrv_z, nupl, thermocap]
      # MVRV Z 와 NUPL 은 계산 재료가 거의 같다(원문 3.4 말미).
      # 합산하면 한 번의 확인을 두 번으로 세는 셈 → 더 극단인 쪽 하나만 채택.
      #
      # 이 계열의 실제 정의는 **"시가총액을 무엇으로 나누는가"** 다.
      #   ÷ 실현시총 (시장 평균 원가)      → MVRV Z, NUPL
      #   ÷ 누적 채굴수익 (누적 생산비)     → 서멀캡
      #   ÷ 활성주소 (네트워크 사용량)      → 활성주소당 시총
      # 분자가 같으니 합산은 이중계산이다. max_abs 로 그때그때 가장 극단인
      # 하나만 채택한다.
      #
      # 이 집계가 각 지표의 약점을 자동으로 상쇄한다. 서멀캡과 활성주소당 시총은
      # 고점에 강하고 바닥에 약한데, 바닥에서는 더 극단인 MVRV 가 선택되므로
      # 무시된다. 반대로 고점에서는 MVRV 의 감쇠를 이 둘이 메운다.
      aggregate: max_abs

    price:
      label: "가격·추세 극단"
      weight: 33
      members: [pi_cycle, grm, ma200w_mult, ma2y_mult]
      # 4개 차트지만 전부 '이동평균 대비 배수'라는 한 아이디어의 변형이다.
      # 그래서 합산이 아니라 평균, 그리고 계열 가중치를 30 이상으로 올리지 않는다.
      aggregate: mean

    supply:
      label: "공급·채굴"
      weight: 27
      members: [puell, hash_ribbons]
      aggregate: mean

  # 결측 처리: 사용 가능한 계열끼리 가중치를 재정규화하고 커버리지를 함께 보고한다.
  coverage:
    min_family_members: 1     # 계열이 살아있다고 인정할 최소 지표 수
    min_coverage_for_action: 0.60   # 가중치 커버리지 60% 미만이면 실행 금지(관망)

# ===========================================================================
# 3. LRS — 유동성 레짐 점수 (-100 긴축 ~ +100 완화)
#    "지금 신호를 믿을 것인가"를 판단하는 배경축 (원문 5장).
# ===========================================================================
lrs:
  weight_note: "합 100. BCS와 섞지 않는다."
  components:
    m2_impulse:
      label: "글로벌 M2 임펄스 (전년비 %)"
      weight: 40
      source: manual
      anchors:
        - [-2.0, -1.00]
        - [ 0.0, -0.60]
        - [ 2.0, -0.20]
        - [ 4.0,  0.10]
        - [ 6.0,  0.50]
        - [ 8.0,  0.80]
        - [12.0,  1.00]
    dxy_trend:
      label: "DXY 추세 (13주 변화율 %, 부호 반전)"
      weight: 25
      source: manual
      invert: true            # 달러 약세가 BTC에 우호적(원문 5장)
      anchors:
        - [-6.0, -1.00]
        - [-3.0, -0.60]
        - [-1.0, -0.20]
        - [ 0.0,  0.00]
        - [ 1.0,  0.20]
        - [ 3.0,  0.60]
        - [ 6.0,  1.00]
    fed_stance:
      label: "연준 스탠스"
      weight: 15
      source: manual
      input_mode: categorical
      states:
        qt_hiking:    -1.00
        qt_hold:      -0.50
        neutral:       0.00
        pause_easing:  0.50
        cutting_qe:    1.00
    etf_flow:
      label: "현물 ETF 30일 누적 순유입 (십억 달러)"
      weight: 20
      source: manual
      # 2024년 이후 새로 생긴 구조적 수요(원문 5장, 7.2)
      anchors:
        - [-6.0, -1.00]
        - [-2.0, -0.60]
        - [-0.5, -0.20]
        - [ 0.5,  0.10]
        - [ 3.0,  0.50]
        - [ 6.0,  0.80]
        - [12.0,  1.00]

  bands:
    - {min:  40, max:  100, key: easing,   label: "완화 — 유동성 순풍"}
    - {min:  10, max:   40, key: mild_easing, label: "완만한 완화"}
    - {min: -10, max:   10, key: neutral,  label: "중립"}
    - {min: -40, max:  -10, key: mild_tightening, label: "완만한 긴축"}
    - {min: -100, max: -40, key: tightening, label: "긴축 — 유동성 역풍"}

# ===========================================================================
# 4. 합의 게이트 — 원문 6.1을 기계화한 것
#    "계산 원리가 다른 지표들이 동시에 같은 방향을 가리킬 때만 신뢰한다"
# ===========================================================================
consensus:
  min_family_abs: 0.30        # 계열이 '방향을 가리킨다'고 인정할 최소 절대값

  # 계열이 3개가 되면서 기준을 다시 세웠다.
  #
  # 4계열 시절 기준은 "3/4 동의, 그중 비가격 2개"였다. 이걸 3계열에 그대로
  # 두면 3/3 만장일치가 되어, 계열이 줄었는데 기준은 오히려 엄해진다.
  # 반대로 비례로 낮추면(2/3, 비가격 1) 가격 계열 + 밸류에이션 하나로
  # 통과해 버려서, 이 게이트가 막으려던 것을 못 막는다.
  #
  # 그래서 비례로 낮췄다: 2/3 동의, 그중 비가격 최소 1.
  #
  # **3계열에서는 "2계열 동의"만으로 가격 단독 통과가 이미 불가능하다.**
  # 가격은 한 계열뿐이라 혼자서는 절대 2를 못 채운다. 게이트가 막으려던 것은
  # 구조적으로 계속 막힌다.
  #
  # 한때 "비가격 둘 다 동의"로 더 조여 봤다가 되돌렸다. 16년 실측에서 분배가
  # 15회 → 13회로 줄고 실행 가중평균가가 $28,261 → $23,905 로 나빠졌다.
  # 이유는 명확하다 — 공급 계열의 고점 탐지력이 사이클마다 떨어지고 있어서
  # (Puell 4년 퍼센타일: 2013 +0.99 / 2017 +1.00 / 2021 +0.46 / 2025 -0.00)
  # 그 계열을 필수로 만들면 고점에서 분배가 막힌다. 약해지는 지표에 게이트를
  # 걸어두면 안 된다.
  min_agreeing_families: 2
  min_non_price_agreeing: 1

  # 결측이 있으면 위 기준을 남은 계열 수에 비례해 낮춘다.
  # 안 그러면 계열이 3개만 남았을 때 만장일치를 요구하게 되는데,
  # 데이터가 적을수록 기준이 엄해지는 것은 방향이 거꾸로다.
  # (결측 자체는 min_coverage_for_action 이 따로 막는다)
  scale_with_available: true
  min_agreeing_floor: 2       # 아무리 낮춰도 2계열 미만으로는 안 내려간다

# ===========================================================================
# 5. 실행 밴드와 분할 사다리 — 원문 6.3 "한 번에 전부 하지 않는다"
# ===========================================================================
bands:
  - {min:  70, max:  100, key: euphoria,     label: "극단 과열",   stance: "분배 가속"}
  - {min:  45, max:   70, key: distribution, label: "과열",       stance: "분배 시작"}
  - {min:  20, max:   45, key: upper_neutral,label: "상단 중립",   stance: "신규 매수 중단, DCA만"}
  - {min: -20, max:   20, key: neutral,      label: "중립",       stance: "기본 DCA 유지"}
  - {min: -45, max:  -20, key: accumulation, label: "저평가",     stance: "DCA 증액"}
  - {min: -70, max:  -45, key: deep_value,   label: "깊은 저평가", stance: "예비현금 투입 시작"}
  - {min: -100, max: -70, key: capitulation, label: "극단 항복",   stance: "예비현금 집중 투입"}

ladders:
  # 매도 사다리: 보유 BTC 대비 비율. 코어 지분은 절대 건드리지 않는다.
  distribute:
    core_hold_pct: 40         # 이 아래로는 어떤 신호가 와도 팔지 않는다
    steps:
      - {trigger_bcs: 45, pct_of_holdings: 10}
      - {trigger_bcs: 55, pct_of_holdings: 10}
      - {trigger_bcs: 65, pct_of_holdings: 10}
      - {trigger_bcs: 75, pct_of_holdings: 15}
      - {trigger_bcs: 85, pct_of_holdings: 15}
    # 누적 최대 60% → core_hold_pct 40% 와 정확히 맞물린다.

  # 매수 사다리: 따로 떼어둔 '예비 현금' 대비 비율. 정기 DCA와는 별개 예산.
  accumulate:
    steps:
      - {trigger_bcs: -30, pct_of_reserve: 15}
      - {trigger_bcs: -45, pct_of_reserve: 20}
      - {trigger_bcs: -58, pct_of_reserve: 20}
      - {trigger_bcs: -70, pct_of_reserve: 20}
      - {trigger_bcs: -82, pct_of_reserve: 25}

  # 정기 DCA 배수: 밴드별로 평소 적립액에 곱한다.
  dca_multiplier:
    euphoria:      0.0
    distribution:  0.0
    upper_neutral: 0.5
    neutral:       1.0
    accumulation:  1.5
    deep_value:    2.0
    capitulation:  2.5

# 히스테리시스 — 같은 계단을 신호 흔들림으로 반복 실행하지 않기 위한 장치
hysteresis:
  # 재무장은 사이클을 넘나드는 장치다. 한 사이클 안에서 같은 계단을 다시 밟게
  # 하려는 것이 아니다. 그래서 "반대편 구간까지 갔다 왔는가"를 조건으로 둔다.
  #
  # 분배 계단은 BCS 가 -20 이하(저평가 밴드)까지 내려갔다 와야 다시 살아나고,
  # 매집 계단은 +20 이상(상단 중립)까지 올라갔다 와야 한다.
  #
  # 16년 실측 근거: 이 값을 "임계에서 8점 되돌림"으로 뒀더니 BCS 의 일상적
  # 변동만으로 계단이 2주마다 재발동해, 2017년 강세장 한 번에 +45 계단이
  # 4번 실행되고 매집 사다리 누적이 795%(상한 100%)까지 갔다.
  rearm_opposite_bcs: 20
  min_days_between_steps: 14  # 서로 다른 계단이라도 최소 14일 간격

  # 임계 돌파가 이 기간만큼 '유지'돼야 인정한다. 실행 횟수가 아니라 기간을
  # 센다 — 임계를 깨지 않고 이어진 기록 구간이 이만큼 뻗어 있으면 확정이다.
  # 매일 돌리면 3일치 기록으로, 주 1회면 두 번의 관측(7일 간격)으로 충족된다.
  # 횟수로 세면 주 1회 사용자는 영원히 확정되지 않는다(운영 문서는 주 1회를
  # 권한다). 막으려던 하루짜리 스파이크는 기간 기준에서도 그대로 막힌다.
  confirm_days: 3

  # 유지 구간 안에서 허용하는 관측 공백. 이걸 두지 않으면 17개월 전 기록
  # 하나와 오늘 기록 하나로 "531일 유지" 가 되어 버린다 — 그 사이에 사이클이
  # 통째로 지나갔을 수 있는데도. 월 1회 운영(30일)까지 여유를 두고 35일.
  confirm_max_gap_days: 35

# LRS가 실행 크기를 조절한다 (신호의 방향이 아니라 '속도'만 바꾼다)
lrs_modifier:
  enabled: true
  bounds: [0.75, 1.25]        # 트랜치 배수는 이 범위를 벗어나지 않는다
  rules:
    # 매도 중 유동성 완화 = 더 갈 수 있다 → 천천히
    - {action: distribute, lrs_min:  40, multiplier: 0.75}
    - {action: distribute, lrs_max: -40, multiplier: 1.25}
    # 매수 중 유동성 완화 = 회복이 빠르다 → 더 크게
    - {action: accumulate, lrs_min:  40, multiplier: 1.25}
    - {action: accumulate, lrs_max: -40, multiplier: 0.75}

# ===========================================================================
# 6. 바닥선 — 점수가 아니라 '가격'으로 답하는 지표들 (원문 4.1 활용법)
#    "언제 팔까"가 아니라 "어디까지 떨어질 수 있나"에 답한다.
# ===========================================================================
floors:
  lines:
    - {key: ma200w,         label: "200주 이동평균",  source: auto,   weight: 0.30}
    - {key: lth_rp,         label: "LTH 실현가격",    source: manual, weight: 0.30}
    # 실현가격 = 실현시총 ÷ 유통량. 2026-07-29 편입 — 자동 계산되는 두 번째 바닥선.
    # 사이클 저점이 이 선의 0.56× → 0.69× → 0.78× → 1.09× 로 단조 수렴해 왔다.
    # 2026 저점($58,525)에서는 네 바닥선 중 가장 정확했다(실현가 $53,560, 9% 이내).
    # 가격이 이 선 아래였던 날은 16년 중 13.2% 뿐이다.
    - {key: realized_price, label: "실현가격",        source: auto,   weight: 0.20}
    # CVDD 는 '역사상 한 번도 깨지지 않은 최악' 선이라 평시에는 기준 바닥을
    # 아래로 끌어내린다. 2026 저점보다 43% 낮았다. 최후방 선으로 강등.
    - {key: cvdd,           label: "CVDD",           source: manual, weight: 0.20}
  # 네 선의 가중평균을 '기준 바닥'으로 삼고, 그 위아래로 분할 매수 구간을 깐다.
  buy_zones:
    - {ratio_to_floor: 1.30, pct_of_reserve: 10, label: "1차 — 기준 바닥 +30%"}
    - {ratio_to_floor: 1.15, pct_of_reserve: 15, label: "2차 — 기준 바닥 +15%"}
    - {ratio_to_floor: 1.00, pct_of_reserve: 25, label: "3차 — 기준 바닥 도달"}
    - {ratio_to_floor: 0.88, pct_of_reserve: 25, label: "4차 — 기준 바닥 -12%"}
    - {ratio_to_floor: 0.75, pct_of_reserve: 25, label: "5차 — 기준 바닥 -25% (역사적 극단)"}

# ===========================================================================
# 7. 저점 프로파일 — 사이클 저점의 공통점 (표시 전용, 점수에 안 들어감)
#
#    2026-07-28 실측: 2015/2018/2022 저점 세 곳이 아래 조건을 **전부** 만족했다.
#    조건이 동시에 성립한 날은 16년 중 극히 드물고, 그 날들이 전부 사이클
#    저점 ±90일 안에 있었다. 최신 수치는 reports/bottoms-*.md 참조.
#
#    **그럼에도 점수에 넣지 않는다.** 임계값을 그 저점들을 보고 정했기 때문에
#    정밀도 100% 는 상당 부분 순환논리다. 표본도 세 사이클뿐이다.
#    바닥선과 같은 취급 — 보여주되 자동으로 계단을 만들지는 않는다.
#    자세한 근거는 docs/09-저점-프로파일.md
# ===========================================================================
bottom_profile:
  enabled: true
  conditions:
    - key: drawdown_pct
      label: "ATH 대비 낙폭"
      op: "<="
      threshold: -75
      unit: "%"
      observed: "2011 -92.7 / 2015 -84.5 / 2018 -83.8 / 2022 -76.6"
    - key: days_since_ath
      label: "ATH 이후 경과"
      op: ">="
      threshold: 160
      unit: "일"
      observed: "2011 163 / 2015 406 / 2018 364 / 2022 378"
    # NUPL < 0 은 이 조건과 수학적으로 완전히 같다 (NUPL = 1 − 1/MVRV).
    # 둘 다 넣으면 하나의 사실이 두 표를 행사하게 되므로 하나만 남겼다.
    # 이 저장소의 최상위 원칙("계산 재료가 같으면 한 개로 센다")을
    # 저점 프로파일에서 스스로 어기고 있던 부분이다.
    - key: mvrv
      label: "MVRV < 1 (= NUPL < 0, 시장 전체가 원가 아래)"
      op: "<"
      threshold: 1.0
      unit: "x"
      observed: "2011 0.42 / 2015 0.56 / 2018 0.69 / 2022 0.78"
    - key: puell
      label: "Puell Multiple"
      op: "<"
      threshold: 0.50
      unit: "x"
      observed: "2011 0.31 / 2015 0.31 / 2018 0.39 / 2022 0.43"
    - key: ma200w_mult
      label: "200주 MA 배수"
      op: "<="
      threshold: 1.05
      unit: "x"
      observed: "2015 0.91 / 2018 1.00 / 2022 0.66"

  # 일치 개수별 해석. 실측된 '저점 ±90일 비중'(정밀도)과 이후 1년 수익 중앙값.
  readings:
    - {min_hits: 5, label: "역사적 바닥권", detail: "과거 이 조건이 모두 성립한 날은 전부 사이클 저점 ±90일 안이었다"}
    - {min_hits: 4, label: "바닥 근접", detail: "다수 조건 충족 — 과거 저점 근처에서 자주 나타난 상태다"}
    - {min_hits: 2, label: "바닥 진입 조짐", detail: "일부 조건만 충족 — 아직 확정적이지 않다"}
    - {min_hits: 1, label: "바닥과 거리 있음", detail: ""}
    - {min_hits: 0, label: "바닥과 무관", detail: "과거 이 상태의 이후 1년 수익 중앙값은 음수였다"}

# ===========================================================================
# 7-B. 고점 프로파일 — 사이클 고점의 공통 조건 (표시 전용, 점수 미반영)
#
# 저점 프로파일과 짝을 이룬다. 만든 이유는 실측된 문제 하나다:
# **기존 점수 지표들의 고점 탐지력이 사이클마다 무너지고 있다.**
#
#   네 고점에서의 4년 퍼센타일
#   Pi Cycle  +0.47 / +0.86 / -0.02 / -0.00
#   Puell     +0.99 / +1.00 / +0.46 / -0.00
#   2년 MA    +0.99 / +1.00 / +0.60 / +0.28
#
# 레벨 기반 조건은 더 심하다 — 2년 MA 배수가 고점에서 17.18 → 9.63 → 2.48
# → 1.63, Puell 이 9.14 → 6.62 → 1.55 → 1.07 이다. 2013 년 기준으로 임계를
# 잡으면 최근 두 고점을 통째로 놓친다. 그래서 **조건을 전부 퍼센타일과
# 달력으로만 구성했다.**
#
# 점수에 넣지 않는 이유는 저점 프로파일과 같다(순환논리 위험). 게다가
# 활성주소당 시총을 실제로 밸류에이션 계열에 넣어 16년 백테스트를 돌려 본
# 결과 **분배가 나빠졌다** — 2021 사이클 고점대비 49% → 41%, 2025 사이클
# 63% → 51%. 고점에서 높은 것은 맞지만 고점 한참 전부터 높아서, 사다리를
# 일찍 발동시켜 싸게 팔게 만든다. 방아쇠로는 못 쓰고 맥락으로만 쓴다.
# ===========================================================================
top_profile:
  enabled: true
  conditions:
    - key: mcap_per_active_pct
      label: "활성주소당 시총 4년 퍼센타일"
      op: ">="
      threshold: 0.80
      unit: ""
      observed: "2013 +1.00 / 2017 +1.00 / 2021 +0.99 / 2025 +1.00"
    - key: thermocap_pct
      label: "서멀캡 배수 4년 퍼센타일"
      op: ">="
      threshold: 0.70
      unit: ""
      observed: "2013 +0.99 / 2017 +1.00 / 2021 +0.79 / 2025 +0.91"
    - key: mvrv_z_pct
      label: "MVRV Z 4년 퍼센타일"
      op: ">="
      threshold: 0.65
      unit: ""
      observed: "2013 +0.94 / 2017 +0.99 / 2021 +0.69 / 2025 +0.71"
    # 온체인이 아니라 달력이다. 4년 리듬이 깨지면 즉시 무의미해진다.
    - key: days_since_halving
      label: "반감기 이후 경과"
      op: "between"
      threshold: [450, 620]
      unit: "일"
      observed: "고점 367 / 526 / 548 / 534 (최근 3사이클 편차 22일)"
    - key: days_since_ath
      label: "최근 신고가 경신"
      op: "<="
      threshold: 21
      unit: "일"
      observed: "고점 1 / 1 / 2 / 0"

  # 일치 개수별 해석. 실측된 '고점 ±90일 비중'(정밀도)과 이후 1년 수익 중앙값.
  # 네 고점 당시의 일치 개수는 4 / 5 / 5 / 5 였다.
  readings:
    - {min_hits: 5, label: "역사적 고점권", detail: "과거 이 조건이 모두 성립한 145일은 전부 사이클 고점 ±90일 안이었고, 이후 1년 수익 중앙값은 -61% 였다"}
    - {min_hits: 4, label: "고점 근접", detail: "다수 조건 충족 — 네 사이클 고점을 모두 포착한 구간이다(정밀도 49%)"}
    - {min_hits: 3, label: "과열 조짐", detail: "일부 조건만 충족 — 아직 확정적이지 않다"}
    - {min_hits: 1, label: "고점과 거리 있음", detail: ""}
    - {min_hits: 0, label: "고점과 무관", detail: ""}

# ===========================================================================
# 8. 반증 조건 — 이 전략을 폐기해야 하는 조건을 미리 못 박아 둔다 (원문 7장)
# ===========================================================================
invalidation:
  - id: INV-1
    text: "한 사이클 동안 BCS +70 밴드에 한 번도 진입하지 못한 채 -45 밴드로 내려간 경우 → 과열 앵커가 현실과 어긋난 것. 상단 앵커 전면 재조정."
  - id: INV-2
    text: "BCS -70 이하에서 매집한 뒤 2년이 지나도 원가 회복이 안 된 경우 → 4년 사이클 구조 자체의 붕괴 가능성. 전략 중단 후 재설계."
  - id: INV-3
    text: "가격 계열과 나머지 3계열이 두 사이클 연속 반대 방향을 가리킨 경우 → 가격 계열 가중치 0으로."
  - id: INV-4
    text: "ETF/기관 순유입이 온체인 지표를 6개월 이상 무력화(지표 극단인데 가격 무반응)한 경우 → LRS를 배경축에서 BCS 구성 계열로 승격 검토."
  # 2026-07-30 추가. 합의 게이트는 '계산 원리가 다른 계열 2개가 같은 방향'을
  # 요구하는데, 그 계열들이 실제로 독립인지 한 번도 재지 않고 있었다.
  # 재 보니 Puell 이 GRM 과 ρ +0.89 였다 — 공급 계열에 가격 지표가 들어 있었다
  # (docs/13). 기준선을 반감기 너머로 옮겨 +0.495 로 낮췄지만, 밸류에이션 ↔
  # 가격은 여전히 +0.833 이다. 그건 실현시총의 성질이라 형식으로 고칠 수 없다.
  # tools/screen_candidate.py 가 이 값을 매번 다시 계산해 보고한다.
  - id: INV-5
    text: "계열 점수 간 순위상관이 두 사이클 연속 0.85 를 넘으면 → 그 두 계열은 독립 확인이 아니다. 하나로 합치고 합의 게이트 기준을 다시 세운다. (2026-07 측정: 밸류에이션↔가격 +0.83, 가격↔공급 +0.58, 밸류에이션↔공급 +0.53)"
