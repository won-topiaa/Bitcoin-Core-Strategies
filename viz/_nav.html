     키로 갈아 끼우고, 스크립트가 그 키로 aria-current 를 붙인다.

     두 버튼의 글자는 스크립트가 채운다 — 언어에 따라 바뀌어야 하는 것을
     HTML 에 적어 두면 두 곳이 어긋난다. 여기 있는 것은 스크립트가 죽었을 때
     남는 기본값이다. -->
