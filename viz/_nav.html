<!-- 세 장이 공유하는 머리띠. 예전에는 각 본문에 복제돼 있었고, 버튼을 하나
     붙이려면 세 곳을 똑같이 고쳐야 했다. build_viz.py 가 __PAGE__ 를 현재 페이지
     키로 갈아 끼우고, 스크립트가 그 키로 aria-current 를 붙인다.

     두 버튼의 글자는 스크립트가 채운다 — 언어에 따라 바뀌어야 하는 것을
     HTML 에 적어 두면 두 곳이 어긋난다. 여기 있는 것은 스크립트가 죽었을 때
     남는 기본값이다. -->
<div class="topbar" data-current="__PAGE__">
  <nav class="pages" aria-label="페이지" data-t-aria="nav.aria">
    <a href="__INDEX_URL__" data-page="index"><span class="n">01</span><span data-t="nav.now">지금 위치</span></a>
    <a href="__VERIFY_URL__" data-page="verify"><span class="n">02</span><span data-t="nav.verify">믿어도 되나</span></a>
    <a href="__RULES_URL__" data-page="rules"><span class="n">03</span><span data-t="nav.rules">규칙과 한계</span></a>
    <a href="__LIQUIDITY_URL__" data-page="liquidity"><span class="n">04</span><span data-t="nav.liquidity">유동성</span></a>
    <a href="__RELATION_URL__" data-page="relationship"><span class="n">05</span><span data-t="nav.relationship">관련성</span></a>
    <a href="__NEWS_URL__" data-page="news"><span class="n">06</span><span data-t="nav.news">뉴스</span></a>
  </nav>
  <div class="ctl">
    <button class="ctlbtn" id="lang-btn" type="button">English</button>
    <button class="ctlbtn" id="theme-btn" type="button">어둡게</button>
  </div>
</div>
<!-- 맨 위로. 이 장들은 길어서(어떤 장은 4,000px+) 상단 내비·언어·테마 버튼이
     스크롤로 사라지면 돌아갈 길이 없다. 한참 내리면 나타나고 누르면 위로 간다.
     스크립트가 없으면 숨은 채로 둔다(순수 부가기능). -->
<button class="backtop" id="backtop" type="button" aria-label="맨 위로" data-t-aria="nav.backtop">
  <svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>
</button>
