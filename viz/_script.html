const dateOf = o => new Date(BASE.getTime() + o * DAY);
const iso = d => d.toISOString().slice(0, 10);
const nf = (v, d) => (v === null || v === undefined) ? "—"

const money = v => "$" + Math.round(v).toLocaleString("en-US");

/* =====================================================================
   언어 — 한국어가 원본이고 영어는 사전에서 온다
   ===================================================================== */
const LS_LANG = "bcs.lang", LS_THEME = "bcs.theme";
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
let LANG = (function(){
  const saved = store.get(LS_LANG);
  if (saved === "ko" || saved === "en") return saved;
  // 저장된 선택이 없으면 브라우저 설정을 따른다. 한국어 화면을 영어권
  // 방문자에게 그대로 내미는 것도, 반대도 둘 다 불친절하다.
  const nav = ((navigator.languages && navigator.languages[0]) ||
               navigator.language || "").toLowerCase();
  return nav.indexOf("ko") === 0 ? "ko" : "en";
})();
const EN = () => LANG === "en";

/** 설정에서 온 문자열(지표·갈래·구간 이름과 설명)의 언어별 선택. */
const pick = (o, f) => (EN() && o && o[f + "_en"]) ? o[f + "_en"] : ((o && o[f]) || "");

const MON_EN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/** 12 → "th", 21 → "st". 백분위를 영어로 읽을 때만 쓴다. */
function ordinal(n){
  const v = Math.abs(Math.round(n)) % 100;
  if (v >= 11 && v <= 13) return "th";
  return {1:"st", 2:"nd", 3:"rd"}[v % 10] || "th";
}

    `is marked with a horizontal line.`,
  altPrice: (from, to, now) =>
    `A line chart of the Bitcoin price from ${from} to ${to} on a log scale. ` +
    `It is ${now} now.`,
  altTP: (mt, mb, gap, now) =>
    `Horizontal bars showing the position score at eight past turning points. The four peaks ` +
    `average ${mt}, the four bottoms ${mb}, and ${gap} points between them are empty. ` +
    `Today is ${now}.`,
  altFam: list => `A line chart of the three families over the last four years. Now: ${list}.`,
  altWidth: (med, p25, p75, stable) =>
    `A box plot of the range width. Median ${med} points, the middle half between ${p25} and ` +
    `${p75}, and the range fits inside one band on ${stable}% of days.`,
  altKbd: "Use the arrow keys to step through dates and read the values.",
  kbdHint: "← → step a date · Shift or PageUp/Down jumps · Home/End first/last · Esc clears"
}
};

function t(key){
  const tab = TX[LANG] || TX.ko;
  const v = (tab[key] !== undefined) ? tab[key] : TX.ko[key];
  if (typeof v === "function")
    return v.apply(null, Array.prototype.slice.call(arguments, 1));
  return v;
}

/** 밴드 → 배경 washes. 0 위는 따뜻하게, 아래는 차갑게. */
const WASH = {
  euphoria:"--wash-warm-3", distribution:"--wash-warm-2", upper_neutral:"--wash-warm-1",
  neutral:"--wash-neutral",
  accumulation:"--wash-cool-1", deep_value:"--wash-cool-2", capitulation:"--wash-cool-3"
};
const BANDS = D.bands.slice().sort((a,b)=>a.min-b.min);
const bandOf = v => D.bands.find(b => v >= b.min && v < b.max) || D.bands[0];
const labelOf = k => pick(D.bands.find(b=>b.key===k) || {}, "label") || k;
const FAMC = ["--s1","--s2","--s3"];
const famLabel = k => pick(D.families.find(f=>f.key===k) || {}, "label") || k;

// 눈금 라벨은 폭에 맞춰 줄인다. 라벨끼리 붙어 버리면 축을 못 읽는다 —
// 겹친 라벨은 없는 라벨보다 나쁘다.
const ALL_TICKS = [-100,-70,-45,-20,0,20,45,70,100];
function tickSet(iw){
  if (iw >= 460) return ALL_TICKS;
  if (iw >= 300) return [-100,-45,0,45,100];
  return [-100,0,100];
}

const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, x, y, s, o){
  o = o || {};
  const n = el("text", {x:x, y:y, fill:o.fill || "var(--muted)",
    "font-size":o.size || 10.5, "font-weight":o.weight || 400,
    "text-anchor":o.anchor || "start", "font-family":o.mono===false?"var(--sans)":"var(--mono)",
    "letter-spacing":o.ls || 0, "dominant-baseline":o.base || "auto"}, parent);
  n.textContent = s;
  if (o.tabular !== false) n.style.fontVariantNumeric = "tabular-nums";
  return n;
}
function clear(svg){ while (svg.firstChild) svg.removeChild(svg.firstChild); }

/** 글자가 실제로 몇 px 인지 **재서** 돌려준다.
 *
 * 글자 수에 계수를 곱해 어림하던 것을 걷어냈다. 같은 글자 수라도 "저점  15.01"
 * 과 "bottom  Dec '18" 은 폭이 딴판이고, 언어를 하나 더 붙이거나 라벨을 조금만
 * 손봐도 어림이 틀린다. 실제로 영어를 붙였을 때 여백이 모자라 라벨이 그림 밖으로
 * 나갔다. 재면 그런 일이 없다. */
function measureText(svg, strings, size, weight){
  const probe = el("text", {x:-9999, y:-9999, "font-size":size,
    "font-family":"var(--sans)", "font-weight":weight || 600}, svg);
  let w = 0;
  for (let i = 0; i < strings.length; i++){
    probe.textContent = strings[i];
    w = Math.max(w, probe.getBBox().width);
  }
  svg.removeChild(probe);
  return w;
}

/** 그림을 읽을 수 없는 사람에게 같은 내용을 글로 준다. 이 페이지는 그림이
    본체라, 그림에 설명이 없으면 화면 낭독기로는 빈 페이지나 다름없다. */
function describe(svg, text){
  if (!svg || !text) return;
  svg.setAttribute("role", "img");
  // 키보드로 짚어 볼 수 있는 그림이면 그 사실도 같이 읽어 준다. 조작할 수 있는
  // 줄 모르면 없는 기능이나 같다.
  svg.setAttribute("aria-label",
    svg.hasAttribute("tabindex") ? text + " " + t("altKbd") : text);
}

/* 이 스크립트 한 벌이 세 장을 모두 그린다. 어느 장에 어떤 요소가 있는지
   스크립트가 알 필요는 없다 — 없으면 건너뛰면 그만이다. 대신 그 판단을
   호출부마다 흩어 놓으면 하나 빠뜨렸을 때 페이지 전체가 죽는다. */
function $(id){ return document.getElementById(id); }
function setText(id, s){ const e = $(id); if (e) e.textContent = s; return !!e; }
function setHTML(id, s){ const e = $(id); if (e) e.innerHTML = s; return !!e; }

/* =====================================================================
   01. 계기판 — 눈금이 그려진 자
   ===================================================================== */
function drawGauge(){
  const host = $("gauge-host"), svg = $("gauge");
  if (!host || !svg) return;
  const W = host.clientWidth || 900;
  const H = 132;
  const PL = 4, PR = 4;
  const iw = W - PL - PR;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  clear(svg);

  const x = v => PL + (v + 100) / 200 * iw;
  const barY = 34, barH = 40;
  const c = D.current;

  // 밴드 구획 — 사이에 2px 표면 간격.
  // 현재 구간이 덮는 구획의 라벨은 지운다. 안 지우면 브래킷과 점이 글자 위에
  // 얹혀 "●은 저평가" 처럼 읽힌다 — 잘린 라벨은 없는 라벨보다 나쁘다.
  const ivLo = Math.min(c.low, c.high), ivHi = Math.max(c.low, c.high);
  BANDS.forEach(b => {
    const x0 = x(b.min), x1 = x(b.max);
    el("rect", {x:x0+1, y:barY, width:Math.max(0,x1-x0-2), height:barH,
      fill:`var(${WASH[b.key]})`}, svg);
    const label = pick(b, "label");
    const w = x1 - x0 - 12;
    const cx = (x0+x1)/2, half = label.length * (EN() ? 3.6 : 6.2);
    const hidden = (cx + half > x(ivLo) - 4) && (cx - half < x(ivHi) + 4);
    if (w > half * 2 + 10 && !hidden)
      txt(svg, cx, barY+barH/2+1, label,
        {anchor:"middle", size:11, fill:"var(--ink-2)", weight:600, mono:false, base:"middle"});
  });
  el("rect", {x:x(-100)+1, y:barY, width:iw-2, height:barH, fill:"none",
    stroke:"var(--rule)", "stroke-width":1}, svg);

  // 0 기준선
  el("line", {x1:x(0), y1:barY-6, x2:x(0), y2:barY+barH+6,
    stroke:"var(--zero)", "stroke-width":1}, svg);

  // 눈금 — 밴드 경계는 길게, 5점마다 짧게. 라벨은 폭에 맞춰 줄인다.
  const labelled = tickSet(iw);
  for (let v=-100; v<=100; v+=5){
    if (ALL_TICKS.indexOf(v) >= 0) continue;
    el("line", {x1:x(v), y1:barY+barH, x2:x(v), y2:barY+barH+4,
      stroke:"var(--axis)", "stroke-width":1, opacity:.55}, svg);
  }
  ALL_TICKS.forEach(v => {
    el("line", {x1:x(v), y1:barY+barH, x2:x(v), y2:barY+barH+9,
      stroke:"var(--axis)", "stroke-width":1}, svg);
    if (labelled.indexOf(v) >= 0)
      txt(svg, x(v), barY+barH+23, (v>0?"+":"") + v,
        {anchor:v<=-100?"start":(v>=100?"end":"middle"), size:10.5});
  });

  // 사다리 계단 — 실행 껍데기는 작게, 눈금 밑에
  const lad = [].concat(
    D.ladders.accumulate.map(s=>({v:s.bcs, kind:"acc"})),
    D.ladders.distribute.map(s=>({v:s.bcs, kind:"dist"})));
  lad.forEach(s => {
    el("path", {d:`M${x(s.v)-3.5},${barY+barH+31} L${x(s.v)+3.5},${barY+barH+31} L${x(s.v)},${barY+barH+26} Z`,
      fill:s.kind==="acc" ? "var(--cool-2)" : "var(--warm-2)", opacity:.55}, svg);
  });
  txt(svg, x(-100), barY+barH+45, t("ladderAcc"),
    {size:10, fill:"var(--muted)", ls:".05em", mono:false});
  txt(svg, x(100), barY+barH+45, t("ladderDist"),
    {size:10, fill:"var(--muted)", ls:".05em", anchor:"end", mono:false});

  // 현재 구간 — 자 위에 놓인 브래킷
  const gx0 = x(c.low), gx1 = x(c.high), gp = x(c.bcs);
  const bTop = barY - 20;
  const accent = c.bcs >= 0 ? "var(--warm-3)" : "var(--cool-3)";
  el("rect", {x:gx0, y:barY-3, width:Math.max(2,gx1-gx0), height:barH+6,
    fill:accent, opacity:.16}, svg);
  [gx0, gx1].forEach(px => {
    el("line", {x1:px, y1:bTop, x2:px, y2:barY+barH+3, stroke:accent, "stroke-width":2}, svg);
  });
  el("line", {x1:gx0, y1:bTop, x2:gx1, y2:bTop, stroke:accent, "stroke-width":2}, svg);
  el("circle", {cx:gp, cy:barY+barH/2, r:5.5, fill:accent, stroke:"var(--surface)", "stroke-width":2}, svg);
  // 범위가 좁으면(오늘은 3.4점 = 자 전체의 1.7%) 브래킷이 실오라기만 해서
  // 눈에 안 들어온다. 폭은 사실대로 두되 **위에 삼각형을 얹어** 위치를 찍는다.
  el("path", {d:`M${gp-5.5},${bTop-4} L${gp+5.5},${bTop-4} L${gp},${bTop+2} Z`,
    fill:accent}, svg);
  txt(svg, gp, bTop-9, t("now"),
    {anchor:"middle", size:10.5, fill:accent, weight:600, ls:".14em", mono:false});
  describe(svg, t("altGauge", nf(c.low,1), nf(c.high,1), labelOf(c.band)));
}

/* =====================================================================
   02-a. 읽는 법 — 띠와 선이 뭔지 그림으로 보여준다
   ===================================================================== */
function drawKey(){
  const svg = $("key-svg");
  if (!svg) return;
  clear(svg);
  // 그림은 왼쪽에, 설명 글은 오른쪽 고정 위치에. 라벨을 곡선 근처에 두면
  // 데이터 모양에 따라 서로 겹친다 — 겹친 라벨은 없는 라벨보다 나쁘다.
  const W = 250, H = 120;
  const PX = 6, PW = 132, PT = 10, PH = H - 20;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);

  el("rect", {x:PX, y:PT, width:PW, height:PH*0.34, fill:"var(--wash-warm-2)"}, svg);
  el("rect", {x:PX, y:PT+PH*0.34, width:PW, height:PH*0.32, fill:"var(--wash-neutral)"}, svg);
  el("rect", {x:PX, y:PT+PH*0.66, width:PW, height:PH*0.34, fill:"var(--wash-cool-2)"}, svg);
  el("rect", {x:PX, y:PT, width:PW, height:PH, fill:"none",
    stroke:"var(--rule)", "stroke-width":1}, svg);

  // 실제 데이터가 아니라 모양만 보여주는 그림이다
  const n = 34;
  const X = i => PX + i/(n-1)*PW;
  const mid = i => PT + PH*(0.62 - 0.34*Math.sin(i/(n-1)*Math.PI) + 0.045*Math.sin(i/2.1));
  const half = i => 4 + 8*Math.abs(Math.sin(i/(n-1)*Math.PI*1.7));

  let up = "", dn = "";
  for (let i=0;i<n;i++) up += (i?" L":"M") + X(i) + "," + (mid(i)-half(i));
  for (let i=n-1;i>=0;i--) dn += " L" + X(i) + "," + (mid(i)+half(i));
  el("path", {d:up+dn+" Z", fill:"var(--cool-2)", opacity:.34}, svg);
  let m = "";
  for (let i=0;i<n;i++) m += (i?" L":"M") + X(i) + "," + mid(i);
  el("path", {d:m, fill:"none", stroke:"var(--ink)", "stroke-width":1.7}, svg);

  txt(svg, PX+4, PT+11, t("keyExpensive"), {size:8.5, fill:"var(--muted)", mono:false});
  txt(svg, PX+4, PT+PH-4, t("keyCheap"), {size:8.5, fill:"var(--muted)", mono:false});

  // 오른쪽 고정 위치의 라벨 두 개 + 지시선.
  // 두 지시선의 시작점을 가로로 떨어뜨린다 — 같은 x 에서 출발하면 둘이
  // 무엇을 가리키는지 구별되지 않는다.
  const LX = PX + PW + 14;
  const kA = Math.round(n * 0.40), kB = Math.round(n * 0.78);
  const rows = [
    {y:PT+14,    px:X(kA), py:mid(kA)-half(kA), text:t("keyBandIs"), dot:"var(--cool-2)"},
    {y:PT+PH-10, px:X(kB), py:mid(kB),          text:t("keyLineIs"), dot:"var(--ink)"},
  ];
  rows.forEach(r => {
    el("path", {d:`M${r.px},${r.py} L${LX-8},${r.y-4}`, fill:"none",
      stroke:"var(--axis)", "stroke-width":1}, svg);
    el("circle", {cx:r.px, cy:r.py, r:2.6, fill:r.dot,
      stroke:"var(--surface)", "stroke-width":1.4}, svg);
    txt(svg, LX, r.y, r.text,
      {size:10, fill:"var(--ink-2)", weight:640, mono:false});
  });
}

/* =====================================================================
   02. 16년 이력 — 구간 리본
   ===================================================================== */
function timeScale(iw, PL){
  const d0 = S[0][0], d1 = S[S.length-1][0];
  return v => PL + (v - d0) / (d1 - d0) * iw;
}
function yearTicks(){
  // 범위 밖 눈금을 그리면 축 왼쪽 바깥에 연도가 떠 있게 된다.
  const d0 = S[0][0], d1 = S[S.length-1][0];
  const out = [];
  const y0 = dateOf(d0).getUTCFullYear(), y1 = dateOf(d1).getUTCFullYear();
  for (let y = y0; y <= y1; y += 2){
    const off = (Date.UTC(y,0,1) - BASE.getTime()) / DAY;
    if (off >= d0 && off <= d1) out.push({y:y, off:off});
  }
  return out;
}

function histLegend(){
  // 새 점선을 범례에 넣지 않으면 "이 점선은 뭐지"가 남는다 — 설명 없는 선은
  // 없는 선보다 나쁘다.
  const cur = D.current;
  const curCol = cur.bcs >= 0 ? "var(--warm-3)" : "var(--cool-3)";
  setHTML("hist-legend",
    `<span><i style="background:var(--cool-2);opacity:.45"></i>${t("legRange")}</span>` +
    `<span><i style="background:var(--ink);height:2px;border-radius:0;margin-bottom:3px"></i>` +
    `${t("legPoint")}</span>` +
    `<span><i style="width:17px;height:0;border-top:2px dashed ${curCol};` +
    `border-radius:0;margin-bottom:3px"></i>${t("legNow")}</span>` +
    `<span><i style="background:var(--warm-3);border-radius:50%"></i>${t("legTop")}</span>` +
    `<span><i style="background:var(--cool-3);border-radius:50%"></i>${t("legBottom")}</span>`);
}

function drawHist(){
  const host = $("hist-host"), svg = $("hist");
  if (!host || !svg) return;
  const W = host.clientWidth || 900;
  const H = Math.max(300, Math.min(400, W * 0.40));
  const PL = 40, PR = 16, PT = 12, PB = 30;
  const iw = W - PL - PR, ih = H - PT - PB;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  clear(svg);

  const X = timeScale(iw, PL);
  const Y = v => PT + (100 - v) / 200 * ih;

  // 밴드 배경
  BANDS.forEach(b => el("rect", {x:PL, y:Y(b.max), width:iw, height:Math.max(0,Y(b.min)-Y(b.max)),
    fill:`var(${WASH[b.key]})`}, svg));
  // 밴드 경계 hairline
  [-70,-45,-20,20,45,70].forEach(v =>
    el("line", {x1:PL, y1:Y(v), x2:PL+iw, y2:Y(v), stroke:"var(--grid)", "stroke-width":1}, svg));
  el("line", {x1:PL, y1:Y(0), x2:PL+iw, y2:Y(0), stroke:"var(--zero)", "stroke-width":1}, svg);
  [-100,-70,-45,-20,0,20,45,70,100].forEach(v =>
    txt(svg, PL-7, Y(v)+3, (v>0?"+":"")+v, {anchor:"end", size:10}));

  // 반감기 세로선. 좁은 화면에서는 글자를 빼고 선만 남긴다 — 위쪽에 2013 고점의
  // 값 라벨이 있어서 둘이 올라탄다. 겹친 라벨은 없는 라벨보다 나쁘다.
  const showHalvingText = iw >= 560;
  D.halvings.forEach(h => {
    const off = (new Date(h+"T00:00:00Z").getTime() - BASE.getTime()) / DAY;
    if (off < S[0][0] || off > S[S.length-1][0]) return;
    el("line", {x1:X(off), y1:PT, x2:X(off), y2:PT+ih, stroke:"var(--axis)",
      "stroke-width":1, "stroke-opacity":.5}, svg);
    if (showHalvingText)
      txt(svg, X(off)+4, PT+11, t("halving"),
        {size:9.5, fill:"var(--muted)", ls:".08em", mono:false});
  });

  // 연도 눈금
  yearTicks().forEach(k => txt(svg, X(k.off), H-9, String(k.y), {anchor:"middle", size:10}));

  // 구간 리본
  let up = "", dn = "";
  S.forEach((r,i) => { up += (i?" L":"M") + X(r[0]) + "," + Y(r[4]); });
  for (let i=S.length-1; i>=0; i--) dn += " L" + X(S[i][0]) + "," + Y(S[i][3]);
  el("path", {d:up+dn+" Z", fill:"var(--cool-2)", opacity:.30}, svg);

  // 대표값
  let mid = "";
  S.forEach((r,i) => { mid += (i?" L":"M") + X(r[0]) + "," + Y(r[2]); });
  el("path", {d:mid, fill:"none", stroke:"var(--ink)", "stroke-width":1.6,
    "stroke-linejoin":"round"}, svg);

  // 전환점
  D.tps.forEach(k => {
    const off = (new Date(k.d+"T00:00:00Z").getTime() - BASE.getTime()) / DAY;
    const top = k.phase === "top";
    const col = top ? "var(--warm-3)" : "var(--cool-3)";
    el("circle", {cx:X(off), cy:Y(k.bcs), r:4.5, fill:col,
      stroke:"var(--surface)", "stroke-width":2}, svg);
    // 값은 고점 위·저점 아래에 붙이되, 그 자리가 그림 밖이면 반대편으로 넘긴다.
    // 2015 저점은 −98.9 라서 아래에 두면 연도 눈금 위에 올라탄다.
    // 점 반지름 4.5 에 테두리 2 라 위아래로 최소 6.5px 는 비켜야 한다.
    let ly = Y(k.bcs) + (top ? -12 : 18);
    if (ly > PT + ih - 3) ly = Y(k.bcs) - 11;
    else if (ly < PT + 9) ly = Y(k.bcs) + 19;
    txt(svg, X(off), ly, nf(k.bcs,0),
      {anchor:"middle", size:10.5, fill:col, weight:600});
  });

  // 오늘 수준을 가로로 그어 준다. **이 한 줄이 "지금이 과거 어디쯤인가"를
  // 그림 하나로 답한다** — 선이 지나는 곳이 전부 오늘과 같은 수준이던 때다.
  // 이게 없으면 16년 그림에서 오늘이 어디인지 표시가 아예 없었다.
  const cur = D.current;
  const curCol = cur.bcs >= 0 ? "var(--warm-3)" : "var(--cool-3)";
  el("line", {x1:PL, y1:Y(cur.bcs), x2:PL+iw, y2:Y(cur.bcs), stroke:curCol,
    "stroke-width":1.5, "stroke-dasharray":"5 4", "stroke-opacity":.85}, svg);
  const nowLabel = t("nowAt", nf(cur.bcs, 0));
  const lw = measureText(svg, [nowLabel], 10.5, 640) + 12;
  el("rect", {x:PL+5, y:Y(cur.bcs)-16, width:lw, height:14, rx:2,
    fill:"var(--surface)", "fill-opacity":.92}, svg);
  txt(svg, PL+11, Y(cur.bcs)-5, nowLabel,
    {size:10.5, fill:curCol, weight:640, mono:false});

  // 위아래가 무슨 뜻인지 그림 안에서 답한다. 색만 두면 위 설명 상자를 읽고
  // 돌아와야 한다.
  txt(svg, PL+iw-6, PT+13, t("keyExpensive"),
    {anchor:"end", size:10, fill:"var(--muted)", mono:false});
  txt(svg, PL+iw-6, PT+ih-6, t("keyCheap"),
    {anchor:"end", size:10, fill:"var(--muted)", mono:false});

  attachCrosshair(svg, "hist-tt", host, X, PL, iw, PT, ih, r => ([
    [t("ttRange"), nf(r[3],1) + " ~ " + nf(r[4],1)],
    [t("ttPoint"), nf(r[2],1)],
    [t("ttBand"), labelOf(bandOf(r[2]).key)],
    [t("ttPrice"), money(r[1])]
  ]));

  const st = D.stats;
  setText("hist-cap", t("histCap", S.length, st.median, st.mean));
  describe(svg, t("altHist", D.span[0], D.span[1], nf(cur.bcs, 1),
    labelOf(cur.band)));
}

function drawPrice(){
  const host = $("price-host"), svg = $("price");
  if (!host || !svg) return;
  const W = host.clientWidth || 900;
  const H = Math.max(150, Math.min(220, W * 0.20));
  const PL = 40, PR = 16, PT = 10, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  clear(svg);

  const X = timeScale(iw, PL);
  const lo = Math.log10(Math.max(0.05, Math.min.apply(null, S.map(r=>r[1]))));
  const hi = Math.log10(Math.max.apply(null, S.map(r=>r[1])));
  const Y = v => PT + (hi - Math.log10(Math.max(0.05,v))) / (hi - lo) * ih;

  for (let e = Math.ceil(lo); e <= Math.floor(hi); e++){
    el("line", {x1:PL, y1:Y(Math.pow(10,e)), x2:PL+iw, y2:Y(Math.pow(10,e)),
      stroke:"var(--grid)", "stroke-width":1}, svg);
    txt(svg, PL-7, Y(Math.pow(10,e))+3,
      e>=3 ? "$"+Math.pow(10,e-3)+"k" : "$"+Math.pow(10,e), {anchor:"end", size:10});
  }
  yearTicks().forEach(k => txt(svg, X(k.off), H-8, String(k.y), {anchor:"middle", size:10}));

  let p = "";
  S.forEach((r,i) => { p += (i?" L":"M") + X(r[0]) + "," + Y(r[1]); });
  el("path", {d:p, fill:"none", stroke:"var(--ink-2)", "stroke-width":1.4,
    "stroke-linejoin":"round"}, svg);

  D.tps.forEach(k => {
    const off = (new Date(k.d+"T00:00:00Z").getTime() - BASE.getTime()) / DAY;
    el("circle", {cx:X(off), cy:Y(k.price), r:4, fill:k.phase==="top"?"var(--warm-3)":"var(--cool-3)",
      stroke:"var(--surface)", "stroke-width":2}, svg);
  });

  attachCrosshair(svg, "price-tt", host, X, PL, iw, PT, ih, r => ([
    [t("ttPrice"), money(r[1])], ["BCS", nf(r[2],1)]
  ]));
  describe(svg, t("altPrice", D.span[0], D.span[1], money(D.current.price)));
}

/* =====================================================================
   03. 전환점 성적표
   ===================================================================== */
function drawTP(){
  const host = $("tp-host"), svg = $("tp");
  if (!host || !svg) return;
  const W = host.clientWidth || 900;
  const rowH = W < 520 ? 34 : 30;
  // 라벨은 전용 칼럼에 넣는다. 구간 끝 옆에 붙이면 저점 쪽 값이 왼쪽 행 라벨과
  // 겹쳐 "저점 15.01" 과 "-98.2" 가 한 덩어리로 읽힌다 — 겹친 라벨은 없는
  // 라벨보다 나쁘다.
  const narrow = W < 520;
  const PR = narrow ? 62 : 78;
  const PT = 54, PB = 56;
  const H = PT + PB + rowH * D.tps.length;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  clear(svg);

  // 행 라벨("고점  13.12" / "peak  Dec '13")을 재서 왼쪽 여백을 정한다.
  const rowLabels = D.tps.map(k =>
    t(k.phase === "top" ? "phaseTop" : "phaseBottom") + "  " +
    t("shortYM", k.d.slice(2, 4), parseInt(k.d.slice(5, 7), 10)));
  const PL = Math.max(narrow ? 74 : 96,
    measureText(svg, rowLabels, narrow ? 10.5 : 11) + 20);
  const iw = W - PL - PR;

  const x = v => PL + (v + 100) / 200 * iw;
  const bandTop = PT - 8, bandBot = H - PB + 8;

  BANDS.forEach(b => el("rect", {x:x(b.min), y:bandTop, width:Math.max(0,x(b.max)-x(b.min)),
    height:bandBot-bandTop, fill:`var(${WASH[b.key]})`}, svg));
  el("line", {x1:x(0), y1:bandTop, x2:x(0), y2:bandBot, stroke:"var(--zero)", "stroke-width":1}, svg);

  ALL_TICKS.forEach(v => {
    el("line", {x1:x(v), y1:bandTop-4, x2:x(v), y2:bandTop,
      stroke:"var(--axis)", "stroke-width":1, opacity:.6}, svg);
    el("line", {x1:x(v), y1:bandBot, x2:x(v), y2:bandBot+4,
      stroke:"var(--axis)", "stroke-width":1, opacity:.6}, svg);
  });
  tickSet(iw).forEach(v => {
    txt(svg, x(v), 18, (v>0?"+":"")+v, {anchor:"middle", size:10});
    txt(svg, x(v), H-14, (v>0?"+":"")+v, {anchor:"middle", size:10});
  });

  const tops = D.tps.filter(k=>k.phase==="top").map(k=>k.bcs);
  const bots = D.tps.filter(k=>k.phase==="bottom").map(k=>k.bcs);
  const gapLo = Math.max.apply(null, bots), gapHi = Math.min.apply(null, tops);

  // 고점 최저와 저점 최고 사이의 빈 공간 — 이 지표의 핵심 증거다.
  // 옅은 테두리로만 그리면 "여기를 보세요"라고 써 놓고 안 보이는 꼴이 된다.
  // 치수선(양끝 화살표)으로 그리면 "이만큼이 비어 있다"가 한눈에 읽힌다.
  const gx0 = x(gapLo), gx1 = x(gapHi), gy = 44;
  [gx0, gx1].forEach(px =>
    el("line", {x1:px, y1:gy, x2:px, y2:bandBot, stroke:"var(--ink)",
      "stroke-width":1.5, "stroke-opacity":.45}, svg));
  el("line", {x1:gx0, y1:gy, x2:gx1, y2:gy, stroke:"var(--ink)",
    "stroke-width":1.5, "stroke-opacity":.45}, svg);
  [[gx0, 1], [gx1, -1]].forEach(pair =>
    el("path", {d:`M${pair[0]},${gy} l${pair[1]*7},-4 l0,8 Z`, fill:"var(--ink)",
      "fill-opacity":.45}, svg));
  const gapPts = (gapHi-gapLo).toFixed(0);
  // 좁은 화면에서는 짧은 문구로. 긴 문구가 치수선을 넘으면 짧은 쪽으로 내린다.
  let gapTxt = narrow ? t("gapShort", gapPts) : t("gapLong", gapPts);
  let gw = measureText(svg, [gapTxt], 11.5, 640) + 14;
  if (gw > gx1 - gx0){
    gapTxt = t("gapShort", gapPts);
    gw = measureText(svg, [gapTxt], 11.5, 640) + 14;
  }
  el("rect", {x:(gx0+gx1)/2 - gw/2, y:gy-11, width:gw, height:17,
    fill:"var(--surface)"}, svg);
  txt(svg, (gx0+gx1)/2, gy+3, gapTxt,
    {anchor:"middle", size:11.5, fill:"var(--ink)", weight:640, ls:".01em", mono:false});

  D.tps.forEach((k,i) => {
    const y = PT + rowH*i + rowH/2;
    const top = k.phase==="top";
    const col = top ? "var(--warm-3)" : "var(--cool-3)";
    txt(svg, PL-14, y+3.5, rowLabels[i],
      {anchor:"end", size:narrow?10.5:11, fill:"var(--ink-2)", weight:600, mono:false});
    el("line", {x1:x(k.low), y1:y, x2:x(k.high), y2:y, stroke:col, "stroke-width":6,
      "stroke-linecap":"butt", opacity:.34}, svg);
    [k.low, k.high].forEach(v =>
      el("line", {x1:x(v), y1:y-7, x2:x(v), y2:y+7, stroke:col, "stroke-width":2}, svg));
    el("circle", {cx:x(k.bcs), cy:y, r:4.5, fill:col, stroke:"var(--surface)", "stroke-width":2}, svg);
    // 값 칼럼
    txt(svg, W-6, y+3.5, nf(k.bcs,1),
      {anchor:"end", size:narrow?11:11.5, fill:col, weight:600});
  });

  // 현재 위치. 빈 공간 경계선과 같은 회색이면 둘이 헷갈리므로 색을 준다.
  const c = D.current;
  const nowCol = c.bcs >= 0 ? "var(--warm-3)" : "var(--cool-3)";
  el("line", {x1:x(c.bcs), y1:bandTop, x2:x(c.bcs), y2:bandBot + 5,
    stroke:nowCol, "stroke-width":2}, svg);
  el("path", {d:`M${x(c.bcs)-5},${bandBot+5} L${x(c.bcs)+5},${bandBot+5} ` +
    `L${x(c.bcs)},${bandBot-1} Z`, fill:nowCol}, svg);
  txt(svg, x(c.bcs), bandBot + 20, t("nowAt", nf(c.bcs,0)),
    {anchor:"middle", size:11, fill:nowCol, weight:640, ls:".02em", mono:false});

  const mean = a => a.reduce((s,v)=>s+v,0)/a.length;
  setText("tp-cap", t("tpCap", nf(mean(tops),1), nf(mean(bots),1),
    nf(gapHi,1), nf(gapLo,1), gapPts));
  describe(svg, t("altTP", nf(mean(tops),1), nf(mean(bots),1), gapPts,
    nf(c.bcs,1)));

  // 표의 마지막 세 열은 갈래 이름이다. 설정에서 가져온다 — 페이지에 적어 두면
  // 갈래 이름을 바꿀 때 표와 나머지가 갈라진다(실제로 갈라져 있었다).
  D.families.forEach((f, i) => setText("tp-th-f" + (i+1), pick(f, "label")));

  const tb = document.querySelector("#tp-table tbody");
  if (!tb) return;
  tb.innerHTML = "";
  const byDate = {};
  S.forEach(r => { byDate[iso(dateOf(r[0]))] = r; });
  D.tps.forEach(k => {
    const r = byDate[k.d] || [];
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td>${t(k.phase==="top" ? "phaseTop" : "phaseBottom")}</td><td>${k.d}</td>` +
      `<td>${money(k.price)}</td>` +
      `<td>${nf(k.low,1)} ~ ${nf(k.high,1)}</td><td>${nf(k.bcs,1)}</td>` +
      `<td>${(k.high-k.low).toFixed(1)}</td>` +
      `<td>${nf(r[5],2)}</td><td>${nf(r[6],2)}</td><td>${nf(r[7],2)}</td>`;
    tb.appendChild(tr);
  });
  const c2 = D.current;
  const tr = document.createElement("tr");
  tr.className = "hi";
  tr.innerHTML = `<td>${t("now")}</td><td>${c2.d}</td><td>${money(c2.price)}</td>` +
    `<td>${nf(c2.low,1)} ~ ${nf(c2.high,1)}</td><td>${nf(c2.bcs,1)}</td>` +
    `<td>${(c2.high-c2.low).toFixed(1)}</td>` +
    `<td>${nf(c2.fam.valuation,2)}</td><td>${nf(c2.fam.price,2)}</td>` +
    `<td>${nf(c2.fam.supply,2)}</td>`;
  tb.appendChild(tr);
}

/* =====================================================================
   04. 계열
   ===================================================================== */
let _uid = 0;

function esc(s){
  return String(s).replace(/[&<>"]/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}

/** 접었다 펴는 설명 한 덩어리. 기본은 접힘 — 궁금한 사람만 연다. */
function toggle(label, body){
  const id = "why-" + (++_uid);
  return `<button class="why" type="button" aria-expanded="false" aria-controls="${id}" ` +
         `data-target="${id}"><span class="mk">+</span>${label}</button>` +
         `<div class="panelbody" id="${id}">${body}</div>`;
}

function wireToggles(root){
  if (!root) return;
  root.querySelectorAll(".why").forEach(btn => {
    if (btn.dataset.wired) return;
    btn.dataset.wired = "1";
    btn.addEventListener("click", () => {
      const body = $(btn.dataset.target);
      if (!body) return;
      const open = body.classList.toggle("open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
      const mk = btn.querySelector(".mk");
      if (mk) mk.textContent = open ? "−" : "+";
    });
  });
}

/** 날짜를 "2023년 3월" / "Mar 2023" 처럼. 정확한 일자는 이 맥락에서 필요 없다. */
function ym(isoDate){
  if (!isoDate) return null;
  return t("ym", isoDate.slice(0, 4), parseInt(isoDate.slice(5, 7), 10));
}

/** 상태로 읽는 지표(Hash Ribbons)의 화면 이름. 두 언어 다 설정에서 온다 —
    여기에 표를 두면 상태를 하나 추가할 때 설정과 어긋나고, 실제로 어긋나
    화면에 "expansion" 이라고 적혀 있었다. */
function stateLabel(v){
  const tab = (EN() ? D.statesEn : D.states) || {};
  return tab[v] || v;
}

/** 지표 아홉 개를 한 표로. 이 페이지에서 가장 먼저 읽히는 부분이다. */
function indicatorTable(){
  const tb = document.querySelector("#ind-table tbody");
  const cardHost = $("ind-cards");
  if (!tb) return;
  tb.innerHTML = "";
  if (cardHost) cardHost.innerHTML = "";
  const cur = D.current.ind || {};
  const famIdx = {};
  D.families.forEach((f, i) => { famIdx[f.key] = i; });

  // 싼 쪽부터 정렬한다. 그래야 "무엇이 가장 극단인가"가 위에서 바로 보인다.
  const rows = D.indMeta.slice().sort((a, b) => {
    const pa = cur[a.key] && cur[a.key].pct, pb = cur[b.key] && cur[b.key].pct;
    if (pa == null) return 1;
    if (pb == null) return -1;
    return pa - pb;
  });

  rows.forEach(m => {
    const v = cur[m.key] || {};
    const i = famIdx[m.family] != null ? famIdx[m.family] : 0;
    const col = `var(${FAMC[i]})`;
    let cell;
    if (v.pct == null){
      cell = `<span style="color:var(--muted)">${t("notComputed")}</span>`;
    } else {
      const pctTxt = (v.pct * 100).toFixed(0) + "%";
      // 막대는 가운데(50%)에서 현재 위치까지 채운다. 방향이 곧 싼 쪽/비싼 쪽이다.
      const lo = Math.min(0.5, v.pct), hi = Math.max(0.5, v.pct);
      cell = `<span class="poscell">` +
        `<span class="posbar"><span class="mid"></span>` +
        `<span class="fill" style="left:${lo*100}%;width:${Math.max(1.2,(hi-lo)*100)}%;` +
        `background:${col}"></span></span>` +
        `<span class="pct">${pctTxt}</span></span>`;
    }
    const raw = v.raw == null ? "—"
      : (typeof v.raw === "number"
          ? (Math.abs(v.raw) >= 100 ? v.raw.toFixed(1) : v.raw.toFixed(2))
          : stateLabel(v.raw));
    const side = v.pct == null ? "" : t(v.pct < 0.5 ? "sideCheap" : "sideRich");
    const when = ym((D.lastSimilar || {})[m.key]);
    const prev = when ? t("prevAt", side, when) : t("prevNone");

    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td class="lbl">${esc(pick(m, "short"))}</td>` +
      `<td class="sub">${esc(pick(m, "explain"))}</td>` +
      `<td>${esc(raw)}</td>` +
      `<td>${cell}</td>` +
      `<td class="sub" style="min-width:0;white-space:nowrap">${esc(when || "—")}</td>` +
      `<td class="sub" style="min-width:0;white-space:nowrap">` +
      `<span class="famdot" style="background:${col}"></span>${esc(famLabel(m.family))}</td>`;
    tb.appendChild(tr);

    if (cardHost){
      const card = document.createElement("div");
      card.className = "indcard";
      card.innerHTML =
        `<div class="top"><span class="nm">${esc(pick(m, "short"))}</span>` +
        `<span class="pct" style="color:${col}">${v.pct == null ? "—"
          : (v.pct*100).toFixed(0) + "%"}</span></div>` +
        `<div class="one">${esc(pick(m, "explain"))}</div>` +
        (v.pct == null ? "" :
          `<span class="posbar" style="display:block;min-width:0"><span class="mid"></span>` +
          `<span class="fill" style="left:${Math.min(0.5,v.pct)*100}%;` +
          `width:${Math.max(1.2,Math.abs(v.pct-0.5)*100)}%;background:${col}"></span></span>`) +
        `<div class="meta"><span>${t("valueNow")} <b>${esc(raw)}</b></span>` +
        `<span>${esc(prev)}</span></div>`;
      cardHost.appendChild(card);
    }
  });

  const vals = D.indMeta.map(m => cur[m.key] && cur[m.key].pct).filter(v => v != null);
  if (vals.length){
    const lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    const below = vals.filter(v => v < 0.5).length;
    setText("ind-note", t("indNote", below, D.indMeta.length, (lo*100).toFixed(0),
      (hi*100).toFixed(0), ((hi-lo)*100).toFixed(0)));
  }
}

/** −1 ~ +1 눈금이 무슨 뜻인지 보여주는 띠. */
function scaleKey(){
  const host = $("scalekey");
  if (!host) return;
  host.innerHTML =
    `<div class="bar"></div><div class="ticks">` +
    t("scaleTicks").map(p => `<span>${p[0]}<b>${esc(p[1])}</b></span>`).join("") +
    `</div>`;
}

/** 세 갈래의 비중을 눈에 보이게. */
function mixBar(){
  const host = $("mixbar");
  if (!host) return;
  const total = D.families.reduce((s, f) => s + f.weight, 0);
  host.innerHTML =
    `<div class="mix">` + D.families.map((f, i) =>
      `<div style="flex:${f.weight};background:var(${FAMC[i]})">${f.weight}%</div>`).join("") +
    `</div><div class="mixlabels">` + D.families.map(f =>
      `<div style="flex:${f.weight}">${esc(pick(f, "label"))}</div>`).join("") + `</div>` +
    `<p style="margin:14px 0 0;font-size:13.5px;color:var(--ink-2)">${t("mixTail", total)}</p>`;
}

function famCards(){
  const host = $("famcards");
  const cur = D.current.fam;
  if (host){
    host.innerHTML = "";
    D.families.forEach((f, i) => {
      const v = cur[f.key];
      const agg = t(f.aggregate === "max_abs" ? "aggMaxAbs" : "aggMean");
      const div = document.createElement("div");
      div.className = "famcard";
      div.innerHTML =
        `<div class="top"><h3><span class="sw" style="background:var(${FAMC[i]})"></span>` +
        `${esc(pick(f, "label"))}</h3><span class="w">${f.weight}</span></div>` +
        `<div class="agg">${t("famShare", f.weight)}</div>` +
        (pick(f, "explain") ? toggle(t("famWhy"),
            `<p style="margin:0">${esc(pick(f, "explain"))}</p>` +
            `<p style="margin:10px 0 0">${t("famHow", agg)}</p>`) : "") +
        `<ul>${f.members.map(m => `<li style="display:block">` +
          `<div class="indi">` +
          `<div class="nm">${esc(pick(m, "label"))}</div>` +
          (pick(m, "explain") ? `<div class="one">${esc(pick(m, "explain"))}</div>` : "") +
          (pick(m, "explain_long") ? toggle(t("moreDetail"),
              `<p style="margin:0">${esc(pick(m, "explain_long"))}</p>`) : "") +
          `</div></li>`).join("")}</ul>` +
        `<div class="score"><span>${t("valueNow")}</span>` +
        `<span><b>${nf(v,2)}</b>${v == null ? "" :
          `<i style="font-style:normal;color:var(--muted);font-size:12px;margin-left:8px">` +
          `${t("fromBottom", Math.round((v+1)/2*100))}</i>`}</span></div>`;
      host.appendChild(div);
    });
    wireToggles(host);
  }
  setHTML("fam-legend", D.families.map((f,i) =>
    `<span><i style="background:var(${FAMC[i]})"></i>${esc(pick(f, "label"))} ` +
    `<b>${nf(cur[f.key],2)}</b></span>`).join(""));
}

function drawFam(){
  const host = $("fam-host"), svg = $("fam");
  if (!host || !svg) return;
  const W = host.clientWidth || 900;
  const H = Math.max(200, Math.min(280, W * 0.26));
  // 선 끝의 갈래 이름은 자리가 있을 때만 붙인다. 이름 길이가 언어마다 두 배
  // 차이 나서 고정 여백으로는 영어에서 그림 밖으로 나간다. 자리가 없으면
  // 빼도 되는 라벨이다 — 바로 위 범례에 세 이름과 현재 값이 이미 있다.
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  clear(svg);
  const labels = D.families.map(f => pick(f, "label"));
  const wide = measureText(svg, labels, 11) + 16;
  const showEnds = W - 40 - wide >= 260;
  const PL = 40, PR = showEnds ? wide : 16, PT = 14, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;

  const cutoff = S[S.length-1][0] - 1461;
  const rows = S.filter(r => r[0] >= cutoff);
  const d0 = rows[0][0], d1 = rows[rows.length-1][0];
  const X = v => PL + (v - d0) / (d1 - d0) * iw;
  const Y = v => PT + (1 - v) / 2 * ih;

  [-1,-0.5,0,0.5,1].forEach(v => {
    el("line", {x1:PL, y1:Y(v), x2:PL+iw, y2:Y(v),
      stroke: v===0 ? "var(--zero)" : "var(--grid)", "stroke-width":1}, svg);
    txt(svg, PL-7, Y(v)+3, nf(v,1), {anchor:"end", size:10});
  });
  const yr0 = dateOf(d0).getUTCFullYear();
  for (let y = yr0; y <= dateOf(d1).getUTCFullYear(); y++){
    const off = (Date.UTC(y,0,1) - BASE.getTime()) / DAY;
    if (off < d0 || off > d1) continue;
    el("line", {x1:X(off), y1:PT, x2:X(off), y2:PT+ih, stroke:"var(--grid)", "stroke-width":1}, svg);
    txt(svg, X(off), H-8, String(y), {anchor:"middle", size:10});
  }

  const ends = [];
  D.families.forEach((f, i) => {
    const idx = 5 + i;
    let p = "", started = false, lastPt = null;
    rows.forEach(r => {
      const v = r[idx];
      if (v === null || v === undefined){ started = false; return; }
      p += (started ? " L" : "M") + X(r[0]) + "," + Y(v);
      started = true; lastPt = [X(r[0]), Y(v), v];
    });
    el("path", {d:p, fill:"none", stroke:`var(${FAMC[i]})`, "stroke-width":2,
      "stroke-linejoin":"round"}, svg);
    if (lastPt){
      el("circle", {cx:lastPt[0], cy:lastPt[1], r:3.5, fill:`var(${FAMC[i]})`,
        stroke:"var(--surface)", "stroke-width":2}, svg);
      ends.push({y:lastPt[1], label:pick(f, "label"), color:`var(${FAMC[i]})`});
    }
  });
  // 끝 라벨을 최소 15px 간격으로 밀어낸다. 세 계열이 −0.59 / −0.65 처럼 붙어
  // 있으면 그냥 그리면 글자가 서로 올라탄다.
  if (showEnds){
    ends.sort((a,b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++)
      if (ends[i].y - ends[i-1].y < 15) ends[i].y = ends[i-1].y + 15;
    ends.forEach(e => txt(svg, PL+iw+10, e.y+3.5, e.label,
      {size:11, fill:e.color, weight:600, mono:false}));
  }

  attachCrosshair(svg, "fam-tt", host, X, PL, iw, PT, ih, r => (
    D.families.map((f, i) => [pick(f, "label"), nf(r[5+i], 2)]).concat([
      ["BCS", nf(r[2],1)],
      [t("ttGate"), r[8] ? t("gatePass") : t("gateFail")]
    ])
  ), rows);
  describe(svg, t("altFam", D.families.map(f =>
    `${pick(f, "label")} ${nf(D.current.fam[f.key], 2)}`).join(", ")));
}

function drawWidth(){
  const host = $("width-host"), svg = $("width");
  if (!host || !svg) return;
  const W = host.clientWidth || 900;
  // 축 이름(가운데)과 꼬리 설명(오른쪽)을 **두 줄로** 나눈다. 한 줄에 두면
  // 좁은 화면에서 둘이 겹치는데, 그건 한국어에서도 그랬다.
  const H = 182;
  const PL = 16, PR = 16, PT = 40, PB = 60;
  const iw = W - PL - PR;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("height", H);
  clear(svg);

  const st = D.stats;
  const maxW = 40;      // p90 가 34.4 다. 80 까지 그리면 절반이 빈 칸이 된다.

  const x = v => PL + Math.min(1, v / maxW) * iw;
  const y = PT, h = H - PT - PB;

  el("line", {x1:PL, y1:y+h, x2:PL+iw, y2:y+h, stroke:"var(--axis)", "stroke-width":1}, svg);
  for (let v=0; v<=maxW; v+=5){
    el("line", {x1:x(v), y1:y+h, x2:x(v), y2:y+h+5, stroke:"var(--axis)", "stroke-width":1}, svg);
    txt(svg, x(v), y+h+19, String(v), {anchor:"middle", size:10});
  }
  txt(svg, PL+iw/2, H-26, t("widthAxis"),
    {anchor:"middle", size:10.5, ls:".02em", mono:false});

  // p10–p90 상자, p25–p75 진한 상자, 중위선
  el("rect", {x:x(st.p10), y:y+h*0.30, width:x(st.p90)-x(st.p10), height:h*0.40,
    fill:"var(--cool-2)", opacity:.16}, svg);
  el("rect", {x:x(st.p25), y:y+h*0.18, width:x(st.p75)-x(st.p25), height:h*0.64,
    fill:"var(--cool-2)", opacity:.34}, svg);
  el("line", {x1:x(st.median), y1:y+h*0.10, x2:x(st.median), y2:y+h*0.92,
    stroke:"var(--ink)", "stroke-width":2}, svg);

  const mark = (v, lab, dy) => {
    el("line", {x1:x(v), y1:y-4, x2:x(v), y2:y+2, stroke:"var(--muted)", "stroke-width":1}, svg);
    txt(svg, x(v), y-9+dy, lab, {anchor:"middle", size:10, fill:"var(--muted)"});
  };
  mark(st.p10, "p10 " + st.p10, 0);
  mark(st.p25, "p25 " + st.p25, -13);
  mark(st.p75, "p75 " + st.p75, -13);
  mark(st.p90, "p90 " + st.p90, 0);
  txt(svg, x(st.median), y+h*0.10-9, t("widthMedian", st.median),
    {anchor:"middle", size:11, fill:"var(--ink)", weight:600, mono:false});
  // 축 오른쪽 끝에 붙이면 눈금 숫자와 겹친다. 축 이름 아래 한 줄을 통째로 쓴다.
  txt(svg, PL+iw, H-8, t("widthTail", maxW, st.p99, st.max),
    {anchor:"end", size:10, fill:"var(--muted)", mono:false});

  setText("width-cap", t("widthCap", st));
  describe(svg, t("altWidth", st.median, st.p25, st.p75, st.stable_pct));
}

/* =====================================================================
   공용 — 크로스헤어 + 툴팁
   ===================================================================== */
/* 차트별 상태. 다시 그릴 때마다 rows·좌표 함수가 바뀌므로 핸들러가 여기서
   현재 것을 읽어 간다. 핸들러 자체는 **한 번만** 붙인다 — svg 요소는 다시
   그려도 살아남기 때문에, 그릴 때마다 붙이면 화살표 한 번에 두 칸, 세 칸씩
   움직이게 된다. */
const CH = {};

function chartKey(ttId, ev){
  const c = CH[ttId];
  if (!c) return;
  const n = c.rows.length;
  let i = c.at;
  if (i == null || i < 0 || i >= n) i = n - 1;
  const jump = Math.max(1, Math.round(n / 20));
  let next = i;
  switch (ev.key){
    case "ArrowLeft":  next = i - (ev.shiftKey ? jump : 1); break;
    case "ArrowRight": next = i + (ev.shiftKey ? jump : 1); break;
    case "PageUp":     next = i - jump; break;
    case "PageDown":   next = i + jump; break;
    case "Home":       next = 0; break;
    case "End":        next = n - 1; break;
    case "Escape":     c.hide(); c.at = null; return;
    default: return;
  }
  ev.preventDefault();
  c.go(Math.max(0, Math.min(n - 1, next)));
}

function attachCrosshair(svg, ttId, host, X, PL, iw, PT, ih, rowsFn, rowsIn){
  const rows = rowsIn || S;
  const tt = $(ttId);
  if (!tt) return;
  const line = el("line", {x1:0, y1:PT, x2:0, y2:PT+ih, stroke:"var(--ink)",
    "stroke-width":1, "stroke-opacity":0}, svg);
  const hit = el("rect", {x:PL, y:PT, width:iw, height:ih, fill:"transparent",
    style:"cursor:crosshair"}, svg);

  // 낭독기에 읽어 줄 자리와 키보드 안내. 있으면 다시 쓰고 없으면 만든다 —
  // 다시 그릴 때마다 새로 붙이면 쌓인다.
  let live = host.querySelector(".sr-live");
  if (!live){
    live = document.createElement("div");
    live.className = "sr-only sr-live";
    live.setAttribute("aria-live", "polite");
    host.appendChild(live);
  }
  let hint = host.querySelector(".kbdhint");
  if (!hint){
    hint = document.createElement("div");
    hint.className = "kbdhint";
    host.appendChild(hint);
  }
  hint.textContent = t("kbdHint");

  function nearest(px){
    let best = rows[0], bd = Infinity;
    for (const r of rows){
      const d = Math.abs(X(r[0]) - px);
      if (d < bd){ bd = d; best = r; }
    }
    return best;
  }
  /** 뷰박스 좌표 → host 안의 픽셀. 키보드로 옮길 때 툴팁을 놓을 자리를 잰다. */
  function toHost(vx, vy){
    const sb = svg.getBoundingClientRect(), hb = host.getBoundingClientRect();
    const k = sb.width / (svg.viewBox.baseVal.width || sb.width);
    return [sb.left - hb.left + vx * k, sb.top - hb.top + vy * k];
  }
  function show(r, px, py){
    line.setAttribute("x1", X(r[0])); line.setAttribute("x2", X(r[0]));
    line.setAttribute("stroke-opacity", .35);
    tt.style.opacity = 1;
    tt.innerHTML = `<div class="d">${iso(dateOf(r[0]))}</div>` +
      rowsFn(r).map(p => `<div class="r"><span>${esc(p[0])}</span>` +
        `<span>${esc(p[1])}</span></div>`).join("");
    const hb = host.getBoundingClientRect();
    let left = px + 14;
    if (left + tt.offsetWidth > hb.width) left = px - tt.offsetWidth - 14;
    tt.style.left = Math.max(0, left) + "px";
    tt.style.top = Math.max(0, py) + "px";
  }
  function hide(){
    tt.style.opacity = 0; line.setAttribute("stroke-opacity", 0);
  }
  function go(i){
    const r = rows[i];
    const at = toHost(X(r[0]), PT + 4);
    show(r, at[0], at[1]);
    CH[ttId].at = i;
    // 툴팁은 마우스용이라 낭독기가 읽지 않는다. 같은 내용을 글로 따로 준다.
    live.textContent = iso(dateOf(r[0])) + ". " +
      rowsFn(r).map(p => p[0] + " " + p[1]).join(". ");
  }

  CH[ttId] = Object.assign(CH[ttId] || {at: null},
    {rows: rows, hide: hide, go: go});

  function move(ev){
    const box = svg.getBoundingClientRect();
    const scale = (svg.viewBox.baseVal.width || box.width) / box.width;
    const px = (ev.clientX - box.left) * scale;
    const hb = host.getBoundingClientRect();
    show(nearest(px), ev.clientX - hb.left,
         ev.clientY - hb.top - tt.offsetHeight - 10);
  }
  hit.addEventListener("mousemove", move);
  hit.addEventListener("mouseleave", hide);
  hit.addEventListener("touchmove", ev => {
    if (ev.touches[0]) move(ev.touches[0]);
  }, {passive:true});

  // --- 키보드 ------------------------------------------------------------
  svg.setAttribute("tabindex", "0");
  if (!svg.dataset.kbWired){
    svg.dataset.kbWired = "1";
    svg.addEventListener("keydown", ev => chartKey(ttId, ev));
    svg.addEventListener("focus", () => {
      const c = CH[ttId];
      // 처음 들어오면 **오늘**부터. 16년 왼쪽 끝에서 시작하면 5,000번을 눌러야
      // 지금에 닿는다.
      if (c) c.go(c.at == null ? c.rows.length - 1 : c.at);
    });
    svg.addEventListener("blur", () => { const c = CH[ttId]; if (c) c.hide(); });
  }
}

   헤더 · 스탯

/** 마지막 데이터가 며칠 전인가 — **보는 시점에** 센다.
    구워 넣은 "1일 전"은 하루만 지나면 거짓이 된다. */
function freshness(){
  const lat = (D.latest || D.current || {}).d;
  const host = $("src-fresh");
  if (!host || !lat) return;
  const days = Math.max(0, Math.floor(
    (Date.now() - Date.parse(lat + "T00:00:00Z")) / DAY));
  const stale = days > 3;
  host.className = stale ? "stale" : "";
  host.textContent = days === 0 ? t("freshToday")
    : (stale ? t("freshStale", days) : t("freshDays", days));
}

function fillText(){
  setText("src-span", D.span[0] + " → " + D.span[1]);
  setText("src-days", t("srcDays", D.nDays.toLocaleString("en-US"), D.indMeta.length));
  freshness();

  const c = D.current;
  setText("ro-range", nf(c.low,0) + " ~ " + nf(c.high,0));
  const bLo = labelOf(bandOf(c.low).key), bHi = labelOf(bandOf(c.high).key);
  if (setText("ro-band", c.stable ? labelOf(c.band) : bLo + " ~ " + bHi))
    $("ro-band").style.color = c.bcs >= 0 ? "var(--warm-3)" : "var(--cool-3)";
  setText("ro-asof", t("asOf", c.d, money(c.price)));
  if (c.rank != null)
    setHTML("ro-rank", t("rankLine", Math.round(c.rank * 100),
      D.nDays.toLocaleString("en-US")));

  // 어제·지난주·지난달 대비. 매일 보는 사람에게는 절대값보다 변화가 궁금하다.
  // 값이 올라가면 "비싼 쪽으로", 내려가면 "싼 쪽으로" 움직인 것이다.
  if (D.deltas){
    const labels = t("dLabels");
    setHTML("ro-deltas", ["d1", "d7", "d30"].map(k => {
      const v = D.deltas[k];
      if (!v) return "";
      const col = Math.abs(v.bcs) < 0.05 ? "var(--muted)"
        : (v.bcs > 0 ? "var(--warm-3)" : "var(--cool-3)");
      const px = v.price_pct == null ? ""
        : `<i>${t("deltaPrice", (v.price_pct >= 0 ? "+" : "") + v.price_pct.toFixed(1))}</i>`;
      return `<span>${t("deltaVs", labels[k])}<b style="color:${col}">` +
             `${t("deltaPts", (v.bcs >= 0 ? "+" : "") + v.bcs.toFixed(1))}</b>${px}</span>`;
    }).filter(Boolean).join(""));
  }

  // 계기판 밑의 '눈금 읽는 법' 하나만 접어 둔다. 점수 계산 원리는 다음 장이
  // 통째로 다루므로 여기서 또 설명하지 않는다 — 겹치면 첫 화면만 무거워진다.
  const bandRows = D.bands.slice().sort((a, b) => b.min - a.min).map(b =>
    `<div class="bandrow"><span>${nf(b.min,0)} ~ ${nf(b.max,0)}</span>` +
    `<span>${esc(pick(b, "label"))}</span></div>`).join("");
  if (setHTML("gauge-why", toggle(t("whyScale"), t("whyScaleBody", bandRows))))
    wireToggles($("gauge-why"));

  const notes = (D.deriveNotes || []).map(p => EN() ? p[1] : p[0]);
  const lat = D.latest;
  let foot = t("footBase");
  if (notes.length) foot += t("footNotes", notes.join(" / "));
  if (lat && lat.d !== D.current.d) foot += t("footLate", lat.d, lat.nmiss);
  setText("foot-derive", foot);
}

function themeNow(){
  const set = document.documentElement.getAttribute("data-theme");
  if (set === "dark" || set === "light") return set;
  return (window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
}

function paintControls(){
  const lb = $("lang-btn");
  if (lb){
    // 버튼에는 **바뀔 언어**를 적는다. 지금 언어를 적으면 누르면 무엇이 되는지
    // 알 수 없다.
    lb.innerHTML = ICON.globe +
      `<span class="lbl" lang="${EN() ? "ko" : "en"}">${t(EN() ? "toKorean" : "toEnglish")}</span>`;
    lb.setAttribute("aria-label", t("langAria"));
  }
  const tb = $("theme-btn");
  if (tb){
    const dark = themeNow() === "dark";
    tb.innerHTML = (dark ? ICON.sun : ICON.moon) +
      `<span class="lbl">${t(dark ? "themeLight" : "themeDark")}</span>`;
    tb.setAttribute("aria-label", t(dark ? "themeLightAria" : "themeDarkAria"));
  }
}

/* =====================================================================
   언어 적용 — 한국어 원본을 기억해 두고 갈아 끼운다
   ===================================================================== */
const ORIG = new Map();
function applyLang(){
  document.documentElement.setAttribute("lang", EN() ? "en" : "ko");
  document.querySelectorAll("[data-t]").forEach(n => {
    // data-t 는 절대 겹쳐 쓰지 않는다. 부모의 innerHTML 을 갈면 자식 노드가
    // 사라져서 되돌릴 원본을 잃는다. tests/test_i18n.py 가 중첩을 막는다.
    if (!ORIG.has(n)) ORIG.set(n, n.innerHTML);
    const en = I18N[n.getAttribute("data-t")];
    n.innerHTML = (EN() && en != null) ? en : ORIG.get(n);
  });
}

});
const themeBtn = $("theme-btn");
if (themeBtn) themeBtn.addEventListener("click", () => {
  const next = themeNow() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  store.set(LS_THEME, next);
  paintControls();                 // 다시 그리기는 아래 MutationObserver 가 맡는다
});

let timer = null;
const ro = new ResizeObserver(() => {
  clearTimeout(timer); timer = setTimeout(drawAll, 120);
});
const wrapEl = document.querySelector(".wrap");
if (wrapEl) ro.observe(wrapEl);

// 테마가 바뀌면 밴드 wash 색이 바뀌므로 다시 그린다.
const mo = new MutationObserver(() => setTimeout(drawAll, 30));
mo.observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onScheme = () => { setTimeout(drawAll, 30); paintControls(); };
  if (mq.addEventListener) mq.addEventListener("change", onScheme);
}
})();
</script>
