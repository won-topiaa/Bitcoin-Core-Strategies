<title>__TITLE__</title>
<style>
:root{
  color-scheme: light;
  --plane:#f6f7f9; --surface:#fbfbfc; --surface-2:#f1f3f6;
  --ink:#101317; --ink-2:#4e535b; --muted:#868c96;
  --grid:#e3e6eb; --axis:#c8cdd5; --rule:rgba(16,19,23,.10);
  --warm-3:#c0322f; --warm-2:#d6624a; --warm-1:#e4a68f;
  --cool-1:#93b6df; --cool-2:#3f7fc4; --cool-3:#1d5091;
  --zero:#b9bec7;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --crit:#d03b3b;
  --wash-warm-3:rgba(192,50,47,.14); --wash-warm-2:rgba(214,98,74,.10); --wash-warm-1:rgba(228,166,143,.09);
  --wash-neutral:rgba(134,140,150,.07);
  --wash-cool-1:rgba(147,182,223,.11); --wash-cool-2:rgba(63,127,196,.13); --wash-cool-3:rgba(29,80,145,.17);
  --sans:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --plane:#0b0c0e; --surface:#121316; --surface-2:#191b1f;
    --ink:#f3f4f6; --ink-2:#b7bcc5; --muted:#7d838d;
    --grid:#24262b; --axis:#383b41; --rule:rgba(255,255,255,.10);
    --warm-3:#e8615c; --warm-2:#d0705a; --warm-1:#8d5e51;
    --cool-1:#5c7da4; --cool-2:#4a8ce0; --cool-3:#7ba7de;
    --zero:#4a4e55;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good:#0ca30c; --crit:#e66767;
    --wash-warm-3:rgba(232,97,92,.16); --wash-warm-2:rgba(208,112,90,.11); --wash-warm-1:rgba(141,94,81,.12);
    --wash-neutral:rgba(125,131,141,.08);
    --wash-cool-1:rgba(92,125,164,.13); --wash-cool-2:rgba(74,140,224,.13); --wash-cool-3:rgba(123,167,222,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0b0c0e; --surface:#121316; --surface-2:#191b1f;
  --ink:#f3f4f6; --ink-2:#b7bcc5; --muted:#7d838d;
  --grid:#24262b; --axis:#383b41; --rule:rgba(255,255,255,.10);
  --warm-3:#e8615c; --warm-2:#d0705a; --warm-1:#8d5e51;
  --cool-1:#5c7da4; --cool-2:#4a8ce0; --cool-3:#7ba7de;
  --zero:#4a4e55;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good:#0ca30c; --crit:#e66767;
  --wash-warm-3:rgba(232,97,92,.16); --wash-warm-2:rgba(208,112,90,.11); --wash-warm-1:rgba(141,94,81,.12);
  --wash-neutral:rgba(125,131,141,.08);
  --wash-cool-1:rgba(92,125,164,.13); --wash-cool-2:rgba(74,140,224,.13); --wash-cool-3:rgba(123,167,222,.16);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
  word-break:keep-all; overflow-wrap:break-word;
}
.wrap{max-width:1160px; margin:0 auto; padding:clamp(28px,5vw,64px) clamp(16px,4vw,40px) 88px}
.eyebrow{
  font-size:11.5px; font-weight:640; letter-spacing:.09em;
  color:var(--muted); margin:0 0 10px
}
.eyebrow em{font-family:var(--mono); font-style:normal; letter-spacing:.12em}
h1{
  font-size:clamp(30px,5.2vw,52px); line-height:1.05; letter-spacing:-.022em;
  font-weight:650; margin:0 0 18px; text-wrap:balance; max-width:22ch
}
h2{
  font-size:clamp(19px,2.6vw,25px); line-height:1.24; letter-spacing:-.014em;
  font-weight:640; margin:0 0 6px; text-wrap:balance
}
h3{font-size:15px; font-weight:640; letter-spacing:-.005em; margin:0 0 4px}
p{margin:0 0 14px; max-width:66ch; color:var(--ink-2)}
p.lead{font-size:17px; color:var(--ink); max-width:60ch}
strong{color:var(--ink); font-weight:620}
a{color:var(--s1)}
hr{border:0; border-top:1px solid var(--rule); margin:0}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

header.top{border-bottom:1px solid var(--rule); padding-bottom:30px; margin-bottom:34px}
.srcline{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.04em; color:var(--muted);
  display:flex; flex-wrap:wrap; gap:6px 20px; margin-top:20px
}
.srcline span{white-space:nowrap}

section{margin-top:52px}
.sechead{margin-bottom:20px}
.sechead .eyebrow{margin-bottom:8px}

.panel{
  background:var(--surface); border:1px solid var(--rule); border-radius:3px;
  padding:clamp(16px,2.4vw,26px)
}
.panel + .panel{margin-top:16px}

/* ---- 게이지 ---- */
.gauge-wrap{padding:clamp(18px,3vw,32px) clamp(16px,3vw,30px) clamp(12px,2vw,20px)}
.readout{display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 26px; margin-bottom:26px}
.readout .big{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:clamp(34px,6.4vw,58px); line-height:1; letter-spacing:-.02em; font-weight:600
}
.readout .band{
  font-size:clamp(15px,2vw,19px); font-weight:640; letter-spacing:-.01em; padding-bottom:5px
}
.readout .asof{font-family:var(--mono); font-size:11.5px; color:var(--muted); padding-bottom:7px; letter-spacing:.04em}
.gauge-svg{display:block; width:100%; height:auto; overflow:visible}

/* ---- 스탯 ---- */
/* 타일이 6개다. auto-fit 으로 두면 폭에 따라 5+1 이 되어 빈 칸이 남고,
   그 칸에 배경(구분선 색)이 그대로 비친다. 6을 나누어떨어지는 열 수만 쓴다. */
.tiles{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--rule);
  border:1px solid var(--rule); border-radius:3px; margin-top:16px; overflow:hidden}
@media (min-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1060px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{background:var(--surface); padding:16px 18px 15px}
.tile .k{font-size:11.5px; font-weight:620; letter-spacing:.03em; color:var(--muted)}
.tile .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:23px; font-weight:600; letter-spacing:-.01em; margin-top:7px; line-height:1.15}
.tile .n{font-size:12px; color:var(--muted); margin-top:3px; line-height:1.4}
.chip{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
  font-family:var(--sans); padding:2px 8px; border-radius:2px; border:1px solid var(--rule)}
.chip .dot{width:7px; height:7px; border-radius:50%}

/* ---- 차트 ---- */
figure{margin:0}
figcaption{font-size:12.5px; color:var(--muted); margin-top:12px; max-width:74ch; line-height:1.55}
.chart-head{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:baseline; gap:8px 20px; margin-bottom:14px}
.legend{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:12.5px; color:var(--ink-2)}
.legend i{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:6px; vertical-align:-1px}
.legend b{font-weight:600; color:var(--ink)}
.chart{position:relative; width:100%}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.tt{
  position:absolute; pointer-events:none; opacity:0; transition:opacity .09s linear;
  background:var(--surface); border:1px solid var(--axis); border-radius:3px;
  padding:9px 11px; font-family:var(--mono); font-size:11.5px; line-height:1.6;
  font-variant-numeric:tabular-nums; box-shadow:0 4px 14px rgba(0,0,0,.10); z-index:5; min-width:150px
}
.tt .d{color:var(--muted); letter-spacing:.04em; margin-bottom:4px}
.tt .r{display:flex; justify-content:space-between; gap:14px; white-space:nowrap}
.tt .r span:last-child{font-weight:600}
@media (prefers-reduced-motion: reduce){.tt{transition:none}}

/* ---- 표 ---- */
.tblwrap{overflow-x:auto; border:1px solid var(--rule); border-radius:3px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:12.5px}
caption{text-align:left; font-size:12.5px; color:var(--muted); padding:12px 14px 0; caption-side:top}
th,td{padding:8px 12px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--rule)}
th:first-child,td:first-child{text-align:left}
thead th{
  font-size:11.5px; letter-spacing:.02em;
  color:var(--muted); font-weight:620; border-bottom:1px solid var(--axis)
}
tbody td{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink-2)}
tbody td:first-child{font-family:var(--sans); color:var(--ink); font-weight:600}
tbody tr:last-child td{border-bottom:0}
tbody tr.hi td{background:var(--surface-2)}

/* ---- 구조 설명 ---- */
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(266px,1fr)); gap:16px}
.famcard{background:var(--surface); border:1px solid var(--rule); border-radius:3px; padding:18px 20px;
  display:flex; flex-direction:column}
.famcard ul{flex:1}
.famcard .score{margin-top:14px; padding-top:12px; border-top:1px solid var(--axis);
  font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:baseline}
.famcard .score b{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:15px; color:var(--ink)}
.famcard .top{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.famcard .w{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:26px; font-weight:600; line-height:1}
.famcard h3{display:flex; align-items:center; gap:8px}
.famcard .sw{width:10px; height:10px; border-radius:2px; flex:none}
.famcard ul{margin:12px 0 0; padding:0; list-style:none; font-size:12.5px; color:var(--ink-2)}
.famcard li{padding:5px 0; border-top:1px solid var(--rule); display:flex; justify-content:space-between; gap:12px}
.famcard .agg{font-size:11.5px; letter-spacing:.01em; color:var(--muted); margin-top:10px}
.famcard .agg b{font-family:var(--mono); font-weight:500; letter-spacing:.06em}
/* 설명 토글 — 궁금한 사람만 펴 본다. 기본은 접힌 상태다. */
.why{
  appearance:none; border:1px solid var(--rule); background:var(--surface-2);
  color:var(--ink-2); font-family:var(--sans); font-size:11.5px; font-weight:600;
  padding:2px 9px 3px; border-radius:2px; cursor:pointer; line-height:1.5;
  display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  transition:background .12s, color .12s
}
.why:hover{background:var(--surface); color:var(--ink); border-color:var(--axis)}
.why[aria-expanded="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.why .mk{font-family:var(--mono); font-size:10px; opacity:.7}
.why[aria-expanded="true"] .mk{opacity:1}
.panelbody{display:none; margin-top:10px; padding:13px 15px; border-radius:2px;
  background:var(--surface-2); border:1px solid var(--rule);
  font-size:13.5px; line-height:1.68; color:var(--ink-2)}
.panelbody.open{display:block}
.panelbody b{color:var(--ink)}
.panelbody .formula{font-family:var(--mono); font-size:12px; color:var(--muted);
  margin-top:9px; display:block}
.bandlist{margin-top:13px; border-top:1px solid var(--rule); padding-top:4px;
  max-width:320px}
.bandrow{display:flex; justify-content:space-between; gap:20px; padding:4px 0;
  font-size:12.5px; border-bottom:1px solid var(--rule)}
.bandrow:last-child{border-bottom:0}
.bandrow span:first-child{font-family:var(--mono); font-variant-numeric:tabular-nums;
  color:var(--muted)}
.bandrow span:last-child{font-weight:600; color:var(--ink)}
@media (prefers-reduced-motion: reduce){.why{transition:none}}

.indi{border-top:1px solid var(--rule); padding:13px 0 14px}
.indi:first-of-type{border-top:0}
.indi .nm{font-size:13.5px; font-weight:620; color:var(--ink); line-height:1.45}
.indi .one{font-size:13px; color:var(--ink-2); margin:3px 0 9px; line-height:1.55}
.indi .why{font-size:11px; padding:1px 8px 2px}

dl.defs{margin:0; display:grid; grid-template-columns:auto 1fr; gap:0}
dl.defs dt{font-size:12px; font-weight:640; letter-spacing:.02em; color:var(--muted);
  padding:11px 22px 11px 0; border-top:1px solid var(--rule); white-space:nowrap}
dl.defs dd{margin:0; padding:11px 0; border-top:1px solid var(--rule); color:var(--ink-2); font-size:13.5px}
dl.defs dt:first-of-type,dl.defs dd:first-of-type{border-top:0}
ul.notes{margin:0; padding-left:20px; color:var(--ink-2); font-size:13.5px}
ul.notes li{margin-bottom:9px; max-width:70ch}
.callout{border-left:2px solid var(--s1); padding:2px 0 2px 18px; margin:20px 0}
.callout p{margin-bottom:0}
footer{margin-top:64px; padding-top:26px; border-top:1px solid var(--rule); font-size:12.5px; color:var(--muted)}
footer p{color:var(--muted); font-size:12.5px; max-width:70ch}

/* 그림 읽는 법 — 범례를 글이 아니라 그림으로 */
.howto{display:grid; grid-template-columns:auto 1fr; gap:clamp(16px,3vw,30px); align-items:start}
.howto-key svg{width:200px; height:96px; display:block}
.howto-txt h3{margin-bottom:8px}
.howto-txt ol{margin:0; padding-left:20px; font-size:13.5px; color:var(--ink-2); line-height:1.66}
.howto-txt li{margin-bottom:8px; max-width:64ch}
.howto-txt li:last-child{margin-bottom:0}
.howto-txt b{color:var(--ink); font-weight:620}
@media (max-width:640px){.howto{grid-template-columns:1fr}}

/* 무엇을 봐야 하는지 짚어 주는 상자 */
.readbox h3{margin-bottom:10px; font-size:15px}
.readbox ol{margin:0; padding-left:20px; font-size:13.5px; color:var(--ink-2); line-height:1.66}
.readbox li{margin-bottom:7px; max-width:70ch}
.readbox li:last-child{margin-bottom:0}
.readbox b{color:var(--ink); font-weight:620}
.readbox p{font-size:13.5px}

/* 지표 요약 표의 위치 막대 */
.posbar{position:relative; height:16px; border-radius:2px; background:var(--surface-2);
  min-width:150px; overflow:hidden}
.posbar .mid{position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--axis)}
.posbar .fill{position:absolute; top:3px; bottom:3px; border-radius:1px; opacity:.85}
.poscell{display:flex; align-items:center; gap:10px; justify-content:flex-end}
.poscell .pct{font-variant-numeric:tabular-nums; min-width:38px; text-align:right}
.tblnote{font-size:12.5px; color:var(--muted); margin-top:10px; max-width:74ch}
td .famdot{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px;
  vertical-align:0}
tbody td.lbl{font-family:var(--sans); color:var(--ink); font-weight:620}
tbody td.sub{font-family:var(--sans); color:var(--muted); font-weight:400; text-align:left;
  white-space:normal; min-width:210px; font-size:12.5px; line-height:1.5}

/* −1 ~ +1 눈금 설명 */
.scalekey{margin-top:14px}
.scalekey .bar{height:26px; border-radius:2px; position:relative; overflow:hidden;
  background:linear-gradient(90deg, var(--wash-cool-3), var(--wash-neutral), var(--wash-warm-3));
  border:1px solid var(--rule)}
.scalekey .ticks{display:flex; justify-content:space-between; margin-top:6px;
  font-family:var(--mono); font-size:11px; color:var(--muted)}
.scalekey .ticks b{display:block; font-family:var(--sans); font-size:12px; color:var(--ink-2);
  font-weight:600; margin-top:2px}
.scalekey .ticks > span{text-align:center; flex:1}
.scalekey .ticks > span:first-child{text-align:left}
.scalekey .ticks > span:last-child{text-align:right}

/* 갈래 비중 막대 */
.mix{display:flex; gap:2px; height:38px; border-radius:2px; overflow:hidden}
.mix > div{display:flex; align-items:center; justify-content:center; color:#fff;
  font-size:12.5px; font-weight:620; letter-spacing:.01em}
.mixlabels{display:flex; gap:2px; margin-top:7px; font-size:11.5px; color:var(--muted)}
.mixlabels > div{text-align:center}

/* 다음 페이지로 */
.nextlink{margin-top:26px}
.nextlink a{display:block; text-decoration:none; background:var(--surface);
  border:1px solid var(--rule); border-radius:3px; padding:18px 22px;
  transition:border-color .12s, background .12s}
.nextlink a:hover{border-color:var(--axis); background:var(--surface-2)}
.nextlink .k{display:block; font-size:11.5px; font-weight:640; letter-spacing:.08em;
  color:var(--muted)}
.nextlink .t{display:block; font-size:19px; font-weight:640; color:var(--ink); margin-top:5px;
  letter-spacing:-.012em}
.nextlink .t::after{content:" \203A"; color:var(--muted)}
.nextlink .d{display:block; font-size:13px; color:var(--ink-2); margin-top:4px}
@media (prefers-reduced-motion: reduce){.nextlink a{transition:none}}
.srcline a{color:var(--ink-2); text-decoration:none; border-bottom:1px solid var(--rule)}
.srcline a:hover{color:var(--ink); border-color:var(--axis)}

/* 사다리 단계 */
.step{display:flex; align-items:center; gap:12px; padding:9px 0;
  border-top:1px solid var(--rule); font-size:13.5px}
.step:first-child{border-top:0}
.step .n{width:20px; height:20px; flex:none; border-radius:50%; background:var(--surface-2);
  color:var(--muted); font-family:var(--mono); font-size:11px; display:flex;
  align-items:center; justify-content:center}
.step .w{flex:1; color:var(--ink-2)}
.step .v{color:var(--ink-2); white-space:nowrap}
.step b{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink);
  font-weight:600}
.steptot{border-top:1px solid var(--axis); margin-top:4px; padding-top:9px;
  font-size:12.5px; color:var(--muted); text-align:right}

/* 어제·지난주·지난달 대비 변화 */
.deltas{display:flex; flex-wrap:wrap; gap:8px 22px; margin:-14px 0 24px;
  font-size:12.5px; color:var(--muted)}
.deltas > span{white-space:nowrap}
.deltas b{font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-weight:600; margin-left:5px}
.deltas i{font-style:normal; font-family:var(--mono); font-variant-numeric:tabular-nums;
  color:var(--ink-2); margin-left:6px}

/* 머리띠 — 페이지 이동 + 언어·테마 */
.topbar{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; margin-bottom:26px}
.ctl{display:flex; gap:2px; margin-left:auto}
.ctlbtn{
  appearance:none; display:inline-flex; align-items:center; gap:6px;
  font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--rule); border-radius:2px;
  padding:7px 12px; cursor:pointer; line-height:1.2; white-space:nowrap;
  transition:border-color .12s, color .12s, background .12s
}
.ctlbtn:hover{border-color:var(--axis); color:var(--ink); background:var(--surface-2)}
.ctlbtn svg{width:14px; height:14px; flex:none; display:block}
/* 글자는 좁은 화면에서도 남긴다. 아이콘만 두면 폭은 줄지만 지구 모양 하나로
   "언어"를 알아내라는 뜻이 되고, 어차피 두 버튼을 합쳐 175px 라 390px 화면의
   한 줄에 들어간다. */
@media (max-width:400px){.ctlbtn{padding:7px 9px; font-size:12px}}
@media (prefers-reduced-motion: reduce){.ctlbtn{transition:none}}

/* 데이터 신선도 — 오래되면 눈에 띄어야 한다 */
.srcline .stale{color:var(--crit); font-weight:600}

/* 페이지 사이 이동 */
nav.pages{display:flex; gap:2px; margin-bottom:0; flex-wrap:wrap}
nav.pages a{
  text-decoration:none; font-size:13px; font-weight:600; color:var(--ink-2);
  padding:7px 14px; border:1px solid var(--rule); border-radius:2px;
  background:var(--surface); transition:border-color .12s, color .12s
}
nav.pages a:hover{border-color:var(--axis); color:var(--ink)}
nav.pages a[aria-current="page"]{background:var(--ink); color:var(--plane); border-color:var(--ink)}
nav.pages .n{font-family:var(--mono); font-size:11px; opacity:.6; margin-right:7px}
@media (prefers-reduced-motion: reduce){nav.pages a{transition:none}}

/* 좁은 화면에서는 표 대신 카드로.
   요약 표는 첫 화면의 핵심인데 폭이 780px 라 390px 화면에서 절반이 잘린다.
   가로 스크롤로 떠넘기면 "핵심을 못 보는 화면"이 된다. */
.indcards{display:none}
.indcard{background:var(--surface); border:1px solid var(--rule); border-radius:3px;
  padding:13px 15px; margin-top:8px}
.indcard .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.indcard .nm{font-size:14px; font-weight:640; color:var(--ink)}
.indcard .pct{font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:15px; font-weight:600; white-space:nowrap}
.indcard .one{font-size:12.5px; color:var(--ink-2); margin:4px 0 9px; line-height:1.5}
.indcard .meta{display:flex; justify-content:space-between; gap:10px; margin-top:7px;
  font-size:11.5px; color:var(--muted)}
.indcard .meta b{font-family:var(--mono); color:var(--ink-2); font-weight:500}
@media (max-width:720px){
  .indtable{display:none}
  .indcards{display:block}
}

/* 인쇄 — 캡처해서 남기는 사람이 많다 */
@media print{
  :root{
    --plane:#fff; --surface:#fff; --surface-2:#fff;
    --ink:#000; --ink-2:#333; --muted:#666;
    --grid:#ddd; --axis:#999; --rule:#ccc
  }
  body{background:#fff; font-size:11pt}
  .wrap{max-width:none; padding:0}
  nav.pages, .ctl, .why, .nextlink, .srcline a{display:none !important}
  .panelbody{display:block !important; border:0; padding:0; background:none;
    margin-top:6px}          /* 접힌 설명도 인쇄에서는 전부 편다 */
  .panel, .tblwrap, .famcard, figure, .tiles{
    break-inside:avoid; page-break-inside:avoid; box-shadow:none}
  section{break-inside:auto; page-break-inside:auto; margin-top:22px}
  h1{font-size:22pt} h2{font-size:15pt} h3{font-size:11.5pt}
  .readout .big{font-size:30pt}
  .tblwrap{overflow:visible}
  .indcards{display:none !important}
  .indtable{display:table !important}
  a[href^="http"]::after{content:" (" attr(href) ")"; font-size:8pt; color:#666}
  footer{margin-top:24px}
}
:focus-visible{outline:2px solid var(--s1); outline-offset:2px}
</style>
<script>
/* 저장된 테마를 **첫 페인트 전에** 적용한다. 본 스크립트에서 하면 OS 가 밝은데
   어둡게 골라 둔 사람은 흰 화면이 한 번 번쩍인 뒤 어두워진다. */
(function(){
  try {
    var v = localStorage.getItem("bcs.theme");
    if (v === "dark" || v === "light") document.documentElement.setAttribute("data-theme", v);
  } catch (e) {}
})();
</script>
