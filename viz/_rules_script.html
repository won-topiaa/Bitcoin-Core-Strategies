<script>
(function(){
"use strict";
const D = window.__BCS__;
const A = window.__BCS_API__;          // 문자열·언어는 본 스크립트가 소유한다
const t = A.t, pick = A.pick, esc = A.esc, nf = A.nf;
const $ = id => document.getElementById(id);

function render(){
  // --- 구간 표 ---------------------------------------------------------
  const tb = document.querySelector("#band-table tbody");
  if (tb){
    tb.innerHTML = "";
    const stances = A.en() ? (D.bandStancesEn || {}) : (D.bandStances || {});
    D.bands.slice().sort((a, b) => b.min - a.min).forEach(b => {
      const dca = D.dca[b.key];
      const tr = document.createElement("tr");
      tr.innerHTML =
        `<td>${nf(b.min,0)} ~ ${nf(b.max,0)}</td>` +
        `<td class="lbl" style="text-align:left">${esc(pick(b, "label"))}</td>` +
        `<td class="sub" style="min-width:0">${esc(stances[b.key] || "")}</td>` +
        `<td>${dca === 0 ? t("bandDcaNone") : "×" + dca.toFixed(1)}</td>`;
      if (b.key === D.current.band) tr.className = "hi";
      tb.appendChild(tr);
    });
  }

  // --- 사다리 ----------------------------------------------------------
  // 단계마다 "점수 얼마에서 얼마를" 두 줄로. 표보다 읽기 쉽다.
  function steps(host, list, unitKey, dirKey){
    const el = $(host);
    if (!el) return;
    el.innerHTML = list.map((s, i) =>
      `<div class="step">` +
      `<span class="n">${i + 1}</span>` +
      `<span class="w">${t("stepScore", nf(s.bcs,0))} ${t(dirKey)}</span>` +
      `<span class="v">${t(unitKey)} <b>${s.pct}%</b></span>` +
      `</div>`).join("") +
      `<div class="steptot">${t("stepTotal", list.reduce((a, s) => a + s.pct, 0))}</div>`;
  }
  steps("acc-steps", D.ladders.accumulate, "stepOfReserve", "stepDown");
  steps("dist-steps", D.ladders.distribute, "stepOfHoldings", "stepUp");

  const core = D.ladders.core_hold_pct;
  const note = $("core-note");
  if (note) note.textContent = t("coreNote", 100 - core);
  const hold = $("core-hold");
  if (hold) hold.innerHTML = t("coreHold", core);

  const notes = (D.deriveNotes || []).map(p => A.en() ? p[1] : p[0]);
  const now = $("derive-now");
  if (now) now.textContent = notes.length
    ? t("deriveNow", notes.join(" / ")) : t("deriveNone");
}

// 언어를 바꿀 때 본 스크립트가 이것도 다시 그려야 한다.
(window.__BCS_HOOKS__ = window.__BCS_HOOKS__ || []).push(render);
render();
})();
</script>
