# 구워 둔 사이트(viz/site)를 GitHub Pages 로 배포한다.
#
# 이 저장소는 사이트를 '다 구운 정적 페이지들'로 viz/site 에 커밋한다. 여기서는
# 그 폴더를 그대로 Pages 에 올린다 — 빌드를 다시 하지 않는다.
#
# ⚠️ 왜 push 트리거가 없는가 (한 번 데이터가 뒤로 간 사고의 교훈):
#   viz/site 는 **데이터에 의존하는 산출물**이다. 그런데 소스를 고치는 사람이
#   최신 market.csv 가 없는 환경(에이전트 샌드박스)에서 사이트를 다시 구우면,
#   며칠 전 데이터가 박힌 낡은 페이지가 나온다. 예전엔 push(paths: viz/site) 로
#   그 낡은 페이지가 그대로 배포돼, CI 가 신선한 데이터로 구워 둔 것을 덮고
#   화면의 기준일이 **뒤로 갔다**. 사용자에겐 갱신이 멈춘 것으로 보였다.
#
#   그래서 배포는 **오직 신선한 CI 빌드 뒤에만** 일어나게 한다:
#     · '데이터 갱신'  — 러너(이그레스 열림)가 최신 데이터를 받아 사이트를 다시
#                        굽고 커밋한다. 소스 push 도 이걸 트리거한다.
#     · '뉴스 갱신'    — 하루 네 번 news.html 만 갈아 끼운다.
#   두 워크플로의 커밋은 GITHUB_TOKEN 으로 push 되는데, 토큰 push 는 다른
#   워크플로의 push 이벤트를 **트리거하지 않는다**(무한루프 방지). 그래서 push
#   대신 workflow_run 으로 그 둘이 끝난 뒤에 이어 붙여 배포가 빠지지 않게 한다.
#
# ⚠️ workflow_run 만으로는 부족하다 (2026-08 실측).
#   같은 '토큰이 낸 이벤트는 새 실행을 만들지 못한다'는 규칙이 workflow_run 에도
#   걸린다. 감시자가 GITHUB_TOKEN 으로 '데이터 갱신'을 workflow_dispatch 로
#   부르면 그 실행은 성공해도 **workflow_run 이벤트를 내지 못해** 여기가 안 뜬다.
#   실측: dispatch 로 시작한 성공 실행 16건 중 배포 0건, schedule 은 1/1.
#   그래서 저장소에는 새 기준일이 들어와 있는데 화면은 옛것으로 남았다.
#   지금은 '데이터 갱신'·'뉴스 갱신'이 푸시에 성공하면 **직접**
#   `gh workflow run pages.yml` 로 아래 workflow_dispatch 를 부른다
#   (workflow_dispatch 는 그 규칙의 명시적 예외라 항상 뜬다).
#   workflow_run 은 그대로 둔다 — 겹쳐도 concurrency 가 정리하고, 직접 호출이
#   막히는 날의 두 번째 겹이 된다.
#
# 최초 1회: configure-pages 가 enablement:true 로 Pages 를 자동으로 켜 본다. 조직/
# 저장소 정책이 막으면 Settings → Pages → Source 를 'GitHub Actions' 로 한 번만
# 바꾼 뒤 이 워크플로를 다시 돌리면 된다.
name: Pages 배포

on:
  workflow_run:
    workflows: ["데이터 갱신", "뉴스 갱신"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩. **진행 중인 것은 취소하지 않는다** — actions/deploy-pages 를
# 중간에 끊으면 배포가 어중간한 상태로 남을 수 있어서, GitHub 이 배포 워크플로에
# 권하는 설정이 false 다. 대기 중인 것은 최신 하나만 남으므로 겹쳐 불려도 안전하다
# (이제 workflow_run 과 직접 호출이 함께 뜰 수 있다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run 으로 올 때는 앞 워크플로가 성공했을 때만 배포한다. 실패한
    # 갱신(예: 데이터 소스가 낡아 후퇴 가드가 멈춤)을 배포로 이어붙이지 않는다.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # workflow_run 은 기본 브랜치의 tip 을 체크아웃한다. 앞 갱신이 방금 커밋한
      # 신선한 viz/site 가 거기 있다.
      - uses: actions/checkout@v4

      - name: Pages 설정 (없으면 자동으로 켜기)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 구운 사이트 업로드 (viz/site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: viz/site

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@v4
