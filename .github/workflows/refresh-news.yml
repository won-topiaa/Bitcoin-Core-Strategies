# 뉴스만 갱신한다 — 하루 네 번, 사이트 전체 재빌드 없이.
#
# 전체를 다시 굽지 않는 이유:
#   (1) data/market.csv 는 .gitignore 라 체크아웃에 없어 매번 다시 받아야 하고
#   (2) 여섯 장이 전부 바뀌어 뉴스 하나 때문에 매번 전체 재배포가 된다.
# 그래서 기사 데이터는 공용 페이로드(__BCS__)와 분리된 마커 구간에 살고,
# tools/inject_news.py 가 구워 둔 news.html 의 그 구간만 갈아 끼운다.
#
# 배포: 이 커밋은 GITHUB_TOKEN 으로 push 되므로 push 이벤트를 트리거하지 않는다.
# 그래서 pages.yml 이 이 워크플로를 workflow_run 으로 지켜보다 끝나면 배포한다
# (예전 주석은 "push 가 배포를 잇는다"고 했으나, 토큰 push 는 push 이벤트를 내지
# 않아 사실이 아니었다 — 그 잠복 결함을 pages.yml 의 workflow_run 으로 고쳤다).
#
# 시각은 매일 02:20 UTC 전체 갱신(refresh-data.yml) **뒤에만** 오게 골랐다 —
# 그 갱신이 news.html 을 통째로 다시 굽기 때문에, 앞서 돌면 서로를 덮어쓴다.
name: 뉴스 갱신

on:
  schedule:
    - cron: "10 5,11,17,23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # 실패 시 조용히 멈추지 않도록 알림 이슈를 연다
  actions: write  # 커밋한 뒤 배포(pages.yml)를 **직접** 부른다

concurrency:
  group: refresh-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fetch_news·inject_news 는 표준 라이브러리만 쓴다 — pip 설치가 없다.
      - name: 기사 수집
        run: python3 tools/fetch_news.py --out data/news.json

      - name: news.html 에 주입
        run: python3 tools/inject_news.py --page viz/site/news.html --news data/news.json

      - name: 커밋·푸시
        id: commit
        run: |
          if git diff --quiet -- viz/site/news.html data/news.json; then
            echo "새 기사가 없습니다."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viz/site/news.html data/news.json
          MSG="뉴스 갱신"
          git commit -m "$MSG"
          # 그 사이 데이터 갱신이나 사람이 밀었으면 non-fast-forward 로 죽는다.
          # ⚠️ reset --soft 로 트리를 통째로 다시 쓰면(예전 방식) 이 실행이
          #    스테이지하지 않은 동시 변경(예: 데이터 갱신의 신선 index.html)을
          #    base 판으로 되돌려 기준일이 뒤로 간다. rebase 는 '우리 커밋의
          #    변경분'(news.html·news.json)만 원격 tip 위에 얹어 나머지를 보존한다.
          for i in 1 2 3 4 5 6; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "푸시 성공."
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$i" -eq 6 ] && break
            echo "푸시 경합 — 원격 tip 위로 우리 커밋만 리베이스합니다 ($i/5)."
            # FETCH_HEAD 는 방금 받은 원격 브랜치 tip 을 확실히 가리킨다.
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs FETCH_HEAD || git rebase --abort || true
            sleep $((i * 3))
          done
          echo "::error::뉴스 갱신 커밋을 원격에 밀지 못했습니다."
          exit 1

      # ⚠️ **배포를 직접 부른다.** pages.yml 은 workflow_run 으로도 이어 붙어 있지만,
      #    그 경로는 이 실행이 schedule 로 시작했을 때만 작동한다. 감시자가
      #    GITHUB_TOKEN 으로 부른 workflow_dispatch 실행은 완료돼도 workflow_run
      #    이벤트를 내지 못한다 — 토큰이 낸 이벤트는 새 실행을 만들지 못한다는
      #    규칙에서 workflow_dispatch/repository_dispatch 만 예외이기 때문이다.
      #    실측으로 확인했다: dispatch 로 시작한 성공 실행 16건 중 배포로 이어진
      #    것이 **0건**, schedule 은 1/1. 그동안 저장소에는 새 기준일이 들어와 있는데
      #    화면은 옛것이었고, 감시자는 되살리기를 부르고도 결과를 못 바꿨다.
      #    workflow_dispatch 는 그 규칙의 예외라 이 호출은 트리거 종류와 무관하게 뜬다.
      #    tests/test_workflows.py 가 이 단계가 사라지지 않게 지킨다.
      - name: 배포 호출 (workflow_run 에 기대지 않는다)
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "커밋을 밀었습니다 — Pages 배포를 직접 부릅니다."
          echo "STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      # 부른다고 **떴는지**까지 본다. 5차 사고가 바로 '불렀는데 안 떴다'였고,
      # 그때 아무도 몰랐다. 배포 실행이 생겼는지만 확인한다 — 화면 내용까지 보면
      # CDN 캐시 때문에 헛알람이 난다. 실행 생성 여부는 그런 흔들림이 없다.
      - name: 배포가 실제로 떴는지 확인
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 10); do
            N=$(gh run list --workflow pages.yml --limit 5 \
                  --json createdAt --jq "[.[] | select(.createdAt > \"${STARTED}\")] | length" 2>/dev/null || echo 0)
            if [ "${N:-0}" -gt 0 ]; then
              echo "배포 실행이 떴습니다 ($N 건)."
              exit 0
            fi
            sleep 15
          done
          echo "::error::배포를 불렀는데 Pages 실행이 뜨지 않았습니다. 저장소에는 새 기준일이 커밋됐지만 화면은 옛것으로 남습니다."
          exit 1

      - name: 실패 알림 (조용히 멈추지 않게)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ 자동 갱신 실패 — ${context.workflow}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `\`${context.workflow}\` 워크플로가 실패했습니다.`,
              ``,
              `- 실행 로그: ${runUrl}`,
              `- 커밋: \`${context.sha}\``,
              `- 이벤트: \`${context.eventName}\``,
              ``,
              `뉴스 페이지가 갱신·배포되지 않았을 수 있습니다. 위 로그에서 실패한 단계를 확인하세요.`,
            ].join('\n');
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title ${JSON.stringify(title)}`,
            });
            const existing = found.data.items.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
