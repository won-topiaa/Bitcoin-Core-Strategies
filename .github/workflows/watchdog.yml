# 자동 갱신이 **실제로 되고 있는지** 지켜보고, 안 되고 있으면 스스로 고친다.
#
# 왜 이게 따로 있어야 하나 — 이 저장소의 자동 갱신은 세 번 조용히 멈췄고, 멈춘
# 이유가 매번 달랐다:
#
#   · 낡은 빌드가 신선한 빌드를 덮어썼다           (배포 정문이 둘이었다)
#   · 토큰 push 가 배포를 트리거하지 못했다          (뉴스가 한 번도 안 올라갔다)
#   · 짧은 시간에 여러 번 푸시하자 실행이 전부 유실됐다  (동시성 큐에서 취소)
#
# 원인은 하나씩 다 고쳤다. 그런데 셋의 공통점은 **멈췄다는 사실을 아무도 몰랐다**는
# 것이다. 원인을 막는 것만으로는 다음 번 새로운 원인을 못 막는다. 그래서 원인이
# 무엇이든 **결과를 보고 되살리는** 감시자를 둔다.
#
# 판정은 tools/site_stale.py 가 하고(tests/test_site_stale.py 가 경계를 지킨다),
# 여기서는 그 판정에 따라 '데이터 갱신'을 부르기만 한다.
name: 갱신 감시

on:
  schedule:
    # 3시간마다. 매일 02:20 UTC 정기 갱신이 실패하거나 유실돼도 늦어도 3시간 안에
    # 되살아난다. 정상일 때는 30초짜리 검사만 돌고 끝난다.
    - cron: "40 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write     # 뒤처졌을 때 '데이터 갱신'을 부른다
  issues: write      # 되살리기까지 실패하면 사람을 부른다

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 소스와 viz/site 의 마지막 커밋 시각을 비교하므로 전체 이력이 필요하다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 뒤처졌는지 판정
        id: check
        run: |
          ASOF=$(python3 tools/site_asof.py viz/site/index.html || true)
          echo "구운 페이지 기준일: ${ASOF:-읽지 못함}"
          if python3 tools/site_stale.py --asof "$ASOF"; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # 뒤처졌으면 '데이터 갱신'을 부른다. 그 워크플로가 최신 데이터로 다시 굽고
      # 커밋하며, 배포(pages.yml)는 거기에 workflow_run 으로 이어 붙는다.
      - name: 되살리기 — 데이터 갱신 호출
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "뒤처짐을 확인했습니다 — 데이터 갱신을 부릅니다."
          gh workflow run refresh-data.yml --ref "${GITHUB_REF_NAME}"

      # 되살리기를 시도했다는 사실 자체를 남긴다. 매번 뒤처져 있다면 되살리기가
      # 듣지 않는다는 뜻이고, 그건 사람이 봐야 한다.
      - name: 되살리기 실패 시 알림
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ 자동 갱신 감시 — 되살리기 실패';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '갱신이 뒤처진 것을 확인했지만 **되살리기까지 실패**했습니다.',
              '',
              `- 실행 로그: ${runUrl}`,
              '',
              '`python3 tools/site_stale.py --asof "$(python3 tools/site_asof.py viz/site/index.html)"`',
              '를 로컬에서 돌리면 무엇이 뒤처졌는지 같은 판정을 볼 수 있습니다.',
            ].join('\n');
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title ${JSON.stringify(title)}`,
            });
            const existing = found.data.items.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
