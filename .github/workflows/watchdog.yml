# 자동 갱신이 **실제로 되고 있는지** 지켜보고, 안 되고 있으면 스스로 고친다.
#
# 왜 이게 따로 있어야 하나 — 이 저장소의 자동 갱신은 세 번 조용히 멈췄고, 멈춘
# 이유가 매번 달랐다:
#
#   · 낡은 빌드가 신선한 빌드를 덮어썼다           (배포 정문이 둘이었다)
#   · 토큰 push 가 배포를 트리거하지 못했다          (뉴스가 한 번도 안 올라갔다)
#   · 짧은 시간에 여러 번 푸시하자 실행이 전부 유실됐다  (동시성 큐에서 취소)
#
# 원인은 하나씩 다 고쳤다. 그런데 셋의 공통점은 **멈췄다는 사실을 아무도 몰랐다**는
# 것이다. 원인을 막는 것만으로는 다음 번 새로운 원인을 못 막는다. 그래서 원인이
# 무엇이든 **결과를 보고 되살리는** 감시자를 둔다.
#
# 무엇을 '결과'로 보는가 — 네 가지를 본다. 앞의 셋은 저장소 안의 결과이고,
# 마지막 하나는 **사람이 실제로 보는 주소**다. 배포만 깨졌을 때 저장소만 보면
# 전부 멀쩡해 보이기 때문이다.
#
#   0) **원본이 이미 새 날짜를 내놨는데 우리가 안 실었나** (진짜 '최신인가')
#   1) 구운 페이지의 기준일이 너무 오래됐나        (데이터가 멈춤)
#   2) 구운 페이지의 소스 SHA 가 지금 소스와 다른가  (고쳤는데 안 구움)
#   3) 마지막으로 **성공한** 정기 갱신이 26시간을 넘었나 (실행 자체가 실패)
#   4) 배포된 페이지의 기준일이 저장소 것과 다른가   (구웠는데 배포 실패)
#
# 판정은 tools/site_stale.py 가 하고(tests/test_site_stale.py 가 경계를 지킨다),
# 여기서는 그 판정에 따라 '데이터 갱신'을 부르기만 한다.
name: 갱신 감시

on:
  schedule:
    # 3시간마다(실측으로는 GitHub 이 절반쯤 건너뛰어 하루 3~4회). 매시간 도는
    # 정기 갱신이 연달아 유실되거나 실패하면 3)번 검사(9시간)가 잡아낸다.
    - cron: "40 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write     # 뒤처졌을 때 '데이터 갱신'을 부르고, 그 이력을 읽는다
  issues: write      # 되살리기까지 실패하면 사람을 부른다
  pages: read        # 배포된 주소를 확인한다

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # 소스 SHA 를 계산하므로 전체 이력이 필요하다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ⚠️ 이 줄이 없어서 감시자가 2026-09-04 부터 36일 동안 **매번 죽었다.**
      #    원본 질의가 btc_core 를 들이고, 설정 모듈이 PyYAML 없을 때 SystemExit 를
      #    던졌다. 그 종료코드 1 을 워크플로가 '뒤처짐'으로 읽어 매 실행마다 무조건
      #    재빌드를 부르고, 이슈 #2 에 헛알림을 108건 달았다. 배포-전용 되살리기는
      #    한 번도 못 돌았다. tests/test_workflows.py 가 이 단계를 지킨다.
      - name: 의존성
        run: pip install -r requirements.txt

      # 마지막으로 **성공한** 정기 갱신 시각. 실패한 실행은 세지 않는다 —
      # "돌긴 돌았다"가 아니라 "결과가 나왔다"를 보는 게 이 감시자의 요점이다.
      - name: 마지막 성공한 갱신 찾기
        id: last
        run: |
          TS=$(gh run list --workflow refresh-data.yml --status success \
                 --limit 1 --json updatedAt --jq '.[0].updatedAt' 2>/dev/null || true)
          if [ -n "$TS" ]; then
            EPOCH=$(date -u -d "$TS" +%s)
            echo "마지막 성공: $TS"
          else
            EPOCH=""
            echo "성공한 갱신 기록을 찾지 못했습니다"
          fi
          echo "epoch=$EPOCH" >> "$GITHUB_OUTPUT"

      - name: 뒤처졌는지 판정
        id: check
        run: |
          # **헤드라인 기준일**(current)로 잰다. 예전에는 span 끝(latest)을 썼는데,
          # 그건 실현시총이 늦어 헤드라인만 하루 뒤처진 상태를 '최신'으로 읽었다.
          ASOF=$(python3 tools/site_asof.py --field current viz/site/index.html || true)
          echo "구운 페이지 헤드라인 기준일: ${ASOF:-읽지 못함}"
          # **원본에 직접 물어본다** — 가격만이 아니라 헤드라인 지표 넷이 다 있는
          # 날을(coinmetrics.latest_complete). 갱신이 성공하면 수렴한다.
          ARGS=(--asof "$ASOF" --site viz/site/index.html --source-latest ask
                --summary "$GITHUB_OUTPUT")
          if [ -n "${{ steps.last.outputs.epoch }}" ]; then
            ARGS+=(--last-refresh "${{ steps.last.outputs.epoch }}")
          else
            echo "※ 갱신 이력을 못 읽어 3)번 검사는 건너뜁니다."
          fi
          # 0=최신 1=뒤처짐 2=판정 불가. 2 를 '뒤처짐'으로 읽으면 감시가 고장 난 채
          # 무조건 재빌드를 부른다(실제로 36일 그랬다). 판정 불가는 실패로 올린다.
          set +e
          python3 tools/site_stale.py "${ARGS[@]}"
          RC=$?
          set -e
          echo "site_stale 종료코드: $RC"
          if [ "$RC" -eq 2 ]; then
            echo "::error::감시 판정 자체가 실패했습니다 — 감시자를 고쳐야 합니다."
            exit 1
          fi

      # 4) 배포된 페이지도 본다. 저장소는 최신인데 Pages 배포만 실패한 경우는
      #    위 셋으로 절대 안 잡힌다 — 사람이 보는 것은 이쪽이다.
      - name: 배포된 페이지 확인
        id: live
        continue-on-error: true
        run: |
          URL=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .html_url 2>/dev/null || true)
          if [ -z "$URL" ]; then
            echo "Pages 주소를 읽지 못했습니다 — 이 검사는 건너뜁니다."
            echo "drift=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "배포 주소: $URL"
          OK=""
          for i in 1 2 3; do
            # Pages 는 max-age=600 으로 내준다. 방금 고친 배포를 10분 동안 못 보지
            # 않도록 캐시를 우회한다.
            if curl -fsSL --max-time 30 "${URL%/}/index.html?cb=$(date +%s)" -o /tmp/live.html; then OK=1; break; fi
            sleep $((i * 5))
          done
          if [ -z "$OK" ]; then
            echo "배포된 페이지를 세 번 다 받지 못했습니다 — 뒤처짐으로 봅니다."
            echo "drift=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # **헤드라인과 자료 마지막 날을 둘 다** 맞대 본다. 예전에는 span 끝만
          # 봤는데, 2026-10-10 장애에서 배포된 페이지(헤드라인 10-08)와 저장소
          # (헤드라인 10-09)가 span 끝은 둘 다 10-09 라 '어긋남 없음'으로 나왔다.
          LIVE="$(python3 tools/site_asof.py --field current /tmp/live.html || true)/$(python3 tools/site_asof.py /tmp/live.html || true)"
          REPO="$(python3 tools/site_asof.py --field current viz/site/index.html || true)/$(python3 tools/site_asof.py viz/site/index.html || true)"
          echo "배포(헤드라인/마지막): ${LIVE} · 저장소: ${REPO}"
          if [ "$LIVE" != "/" ] && [ "$LIVE" = "$REPO" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "배포된 페이지가 저장소와 다릅니다 — 배포가 밀렸습니다."
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      # 되살리기는 **증상에 맞는 것**을 불러야 한다. 예전에는 무엇이 어긋났든
      # '데이터 갱신'만 불렀는데, 저장소는 멀쩡하고 배포만 밀린 경우에는 그게
      # 듣지 않는다 — 다시 구워도 결과가 같아 커밋이 안 생기고, 커밋이 없으면
      # 배포도 없다. 그래서 두 갈래로 나눈다.
      - name: 되살리기 — 데이터 갱신 호출
        if: steps.check.outputs.stale == 'true'
        run: |
          echo "저장소가 뒤처졌습니다 — 데이터 갱신을 부릅니다."
          gh workflow run refresh-data.yml --ref "${GITHUB_REF_NAME}"

      # 저장소는 최신인데 화면만 옛것이면 다시 구울 필요가 없다. 배포만 부른다.
      - name: 되살리기 — 배포만 다시 (저장소는 최신인데 화면만 옛것일 때)
        if: steps.check.outputs.stale != 'true' && steps.live.outputs.drift == 'true'
        run: |
          echo "저장소는 최신인데 배포가 밀렸습니다 — Pages 배포만 다시 부릅니다."
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      # **사람을 부르는 조건은 '명백한 고장'일 때만이다.**
      #
      # 예전 조건은 "정기 갱신이 3시간 안에 성공했는데도 뒤처짐"이었다. 그런데
      # 판정이 죽어 늘 뒤처짐이던 36일 동안 이게 이슈 #2 에 헛알림 108건을 달았고,
      # 판정을 고친 지금도 **정상적인 아침마다** 울린다 — 01시대 갱신은 원본이
      # 실현시총을 내기 전에 돌므로, 원본보다 하루 뒤처진 상태는 고장이 아니라
      # 기다리는 중이다(되살리기가 갱신을 불러 따라잡는다). 그래서 둘로 가른다.
      #
      #   알림  · 감시 자체가 실패(판정 불가·되살리기 호출 실패)
      #         · 데이터가 사흘 넘게 낡음
      #         · 원본보다 **이틀 이상** 뒤처짐 — 정상 지연은 많아야 하루다
      #         · 배포가 어긋났는데 마지막 Pages 배포가 실패로 끝남
      #   조용  · 원본보다 하루 뒤처짐(되살리기만 부른다)
      - name: 명백한 고장이면 알림
        id: verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_STALE: ${{ steps.check.outputs.data_stale }}
          BEHIND_DAYS: ${{ steps.check.outputs.behind_days }}
          DRIFT: ${{ steps.live.outputs.drift }}
          FAILED: ${{ job.status == 'failure' }}
        run: |
          NOTIFY=no; WHY=""
          if [ "$FAILED" = "true" ]; then
            NOTIFY=yes; WHY="감시 자체가 실패했습니다 — 판정을 못 했거나 되살리기 호출이 막혔습니다."
          elif [ "$DATA_STALE" = "true" ]; then
            NOTIFY=yes; WHY="헤드라인 데이터가 사흘 넘게 낡았습니다."
          elif [ "${BEHIND_DAYS:-0}" -ge 2 ]; then
            NOTIFY=yes; WHY="원본보다 ${BEHIND_DAYS}일 뒤처졌습니다 — 정상 지연(하루)을 넘었습니다."
          elif [ "$DRIFT" = "true" ]; then
            LAST_PAGES=$(gh run list --workflow pages.yml --limit 1 --json conclusion --jq '.[0].conclusion' 2>/dev/null || true)
            if [ "$LAST_PAGES" = "failure" ]; then
              NOTIFY=yes; WHY="배포된 페이지가 저장소와 다르고, 마지막 Pages 배포가 실패로 끝났습니다."
            fi
          fi
          echo "notify=$NOTIFY" >> "$GITHUB_OUTPUT"
          echo "why=$WHY" >> "$GITHUB_OUTPUT"
          echo "알림 필요: $NOTIFY $WHY"

      - name: 이슈 열기 / 덧붙이기
        if: always() && steps.verdict.outputs.notify == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '⚠️ 자동 갱신 감시 — 명백한 고장';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              process.env.WHY || '갱신이 뒤처진 것을 확인했습니다.',
              '',
              `- 실행 로그: ${runUrl}`,
              '',
              '로컬에서 같은 판정을 보려면:',
              '',
              '```bash',
              'python3 tools/site_stale.py --asof "$(python3 tools/site_asof.py --field current viz/site/index.html)" --source-latest ask',
              '```',
            ].join('\n');
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title ${JSON.stringify(title)}`,
            });
            const existing = found.data.items.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
        env:
          WHY: ${{ steps.verdict.outputs.why }}
