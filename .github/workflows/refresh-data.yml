# 데이터를 받아 사이트를 다시 굽고 커밋한다 — 매일, 그리고 소스가 바뀔 때마다.
#
# data/market.csv 는 .gitignore 에 있다 — 매일 1MB 짜리 CSV 를 커밋하면 1년에
# 100MB 가 쌓인다. 그래서 저장소에 남기는 것은 **다 구운 페이지들**이고, CSV 는
# 매 실행에서 전 구간을 새로 받는다(1.7초). 증분으로 이어 온 파일과 바이트 단위로
# 같은 결과가 나오는 것은 tests/test_refresh.py 가 지킨다.
#
# ⚠️ 이 워크플로가 배포의 유일한 정문이다. 사이트(viz/site)는 데이터에 의존하는
#    산출물이라, **최신 데이터를 가진 러너**만 올바르게 구울 수 있다. 소스를 고치는
#    사람이 데이터 없는 환경에서 구우면 며칠 전 데이터가 박힌다. 그래서:
#      · schedule       — 매일 최신 데이터로 굽는다.
#      · push(소스 변경) — 소스가 바뀌면 여기서 **신선한 데이터로 다시 구워** 배포로
#                          잇는다. 낡은 viz/site 를 곧바로 배포하지 않는다(pages.yml
#                          에서 push 트리거를 없앤 이유).
#    커밋은 GITHUB_TOKEN 으로 push 되므로 이 워크플로가 스스로를 다시 트리거하지
#    않는다(무한루프 방지). 배포(pages.yml)는 workflow_run 으로 이어 붙는다.
#
# GitHub Actions 의 schedule 은 **기본 브랜치의 워크플로만** 실행한다. 이 저장소는
# claude/bitcoin-key-indicators-strategy-hrcbdd 가 기본 브랜치라, 이 파일이 여기
# 있는 것만으로 매일 자동으로 돈다. 즉시 확인은 workflow_dispatch.
name: 데이터 갱신

on:
  schedule:
    # 매일 02:20 UTC (한국 11:20). CoinMetrics 커뮤니티 티어가 전날 데이터를
    # 채우고 난 뒤여야 해서 자정 직후를 피한다.
    - cron: "20 2 * * *"
  push:
    # 소스가 바뀌면 신선한 데이터로 다시 구워 배포한다. 데이터 없는 환경에서 손으로
    # 구운 낡은 페이지가 배포되던 경로를 이걸로 대체한다. 문서·테스트만 바뀌면
    # 사이트가 안 바뀌므로 트리거하지 않는다.
    branches: ["claude/bitcoin-key-indicators-strategy-hrcbdd"]
    paths:
      - "viz/**"
      - "tools/**"
      - "src/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/refresh-data.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "받아서 검사만 하고 커밋하지 않는다"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write   # 실패 시 조용히 멈추지 않도록 알림 이슈를 연다

concurrency:
  # 앞 실행이 아직 커밋하지 않았는데 다음이 시작하면 서로를 덮어쓴다.
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 지난 실행의 market.csv 복원 (겹침 대조 가드용)
        # data/market.csv 는 .gitignore 라 체크아웃에 없다. 그러면 refresh_data 의
        # 핵심 안전장치인 '겹침 가격 대조'(어제 값과 오늘 값을 맞대 단위·자산이
        # 조용히 바뀌었는지 본다)가 old 가 비어 매번 건너뛰어진다. 지난 실행 파일을
        # 캐시로 되살려 그 대조가 실제로 돌게 한다. 없으면(첫 실행·캐시 만료) 그냥
        # 첫 수집처럼 동작하므로 안전하게 degrade 한다. 병합은 전 구간 재수집이
        # 우선이라(full==incremental 동일성은 test_refresh 가 보증) 결과는 같다.
        uses: actions/cache@v4
        with:
          path: data/market.csv
          key: market-csv-${{ github.run_id }}
          restore-keys: |
            market-csv-

      - name: 의존성
        # pytest 는 런타임 의존성이 아니라 requirements.txt 에 없다. 아래 '테스트'
        # 게이트가 이걸 쓰므로 여기서 함께 깔지 않으면 매 실행이 그 단계에서 죽는다.
        run: pip install -r requirements.txt pytest

      - name: 받아서 병합
        run: python3 tools/refresh_data.py --full

      - name: 거시 데이터 (중국 M2·나스닥·전세계 M2·VIX)
        # GitHub 러너는 에이전트 프록시가 없어 FRED·chinadata·GitHub 모두 열려 있다.
        # fetch_macro 는 기존 macro.csv 와 **열 단위로 병합**하고 원자적으로 쓴다 —
        # 한 소스(chinadata·FRED 일부)가 잠깐 막혀도 그 열/값은 기존 것이 그대로
        # 남는다(예전 임시파일+grep m2_cn 가드가 하던 일을 병합이 일반적으로 보장).
        # 완전 실패면 fetch_macro 가 파일을 건드리지 않고 비정상 종료하므로 넘긴다.
        run: python3 tools/fetch_macro.py --github --global --out data/macro.csv || true

      - name: 주가 (MSTR — 05장 트레저리 부록)
        # 스투크 주 소스 + 야후 폴백. 열 단위 병합·원자적 쓰기라 잠깐 막혀도
        # 기존 값이 남는다. 실패해도 사이트는 그 섹션만 숨긴 채 정상이다.
        run: python3 tools/fetch_stock.py --out data/stocks.csv || true

      - name: 뉴스 (06장 — 여기서도 한 번, 이후는 refresh-news.yml 이 하루 네 번)
        run: python3 tools/fetch_news.py --out data/news.json || true

      - name: 신선도 확인
        # 받았는데도 오래됐으면 원본이 늦은 것이다. 실패시키지 않고 기록만
        # 남긴다 — 커뮤니티 티어는 하루 늦는 것이 정상이다.
        run: python3 tools/refresh_data.py --check --max-age 4 || true

      - name: 테스트
        # 데이터가 바뀌어 계산이 깨졌으면 사이트를 굽기 전에 멈춰야 한다.
        run: python3 -m pytest -q

      - name: 사이트 재생성
        run: |
          python3 tools/build_viz.py --csv data/market.csv --out-dir viz/site \
            | tee build.log
          # 출력이 "기준일: 2026-07-29  (데이터 1일 전)" 이라 날짜만 떼어낸다.
          echo "ASOF=$(sed -n 's/^기준일: \([0-9-]*\).*/\1/p' build.log)" >> "$GITHUB_ENV"
          rm -f build.log

      - name: 후퇴 방지 — 더 오래된 데이터로 덮지 않는다
        # 이 러너가 방금 구운 페이지의 기준일이 **이미 커밋된 것보다 오래됐으면**
        # 굽지도 커밋도 하지 않고 멈춘다. 정상 경로에선 새로 받은 데이터가 같거나
        # 더 최신이라 통과한다. 후퇴는 상류(데이터 소스) 이상이거나 낡은 빌드가
        # 새어 든 것이므로, 조용히 배포하는 대신 실패시켜 알림이 뜨게 한다.
        #
        # 반드시 index.html 만 본다 — news.html 은 남의 기사 텍스트가 구워지는
        # 장이라, 그 텍스트가 우연히 "span":[...] 모양이면 site_asof.py 가
        # 가짜 날짜를 집을 수 있다(tools/site_asof.py 상단 경고 참고).
        run: |
          NEW=$(python3 tools/site_asof.py viz/site/index.html || true)
          OLD=$(git show HEAD:viz/site/index.html 2>/dev/null | python3 tools/site_asof.py - || true)
          echo "새 기준일=${NEW:-?}  이미 배포된 기준일=${OLD:-없음}"
          if [ -n "$NEW" ] && [ -n "$OLD" ] && [[ "$NEW" < "$OLD" ]]; then
            echo "::error::받은 데이터($NEW)가 이미 배포된 것($OLD)보다 오래됐습니다 — 후퇴를 막고 중단합니다."
            exit 1
          fi

      - name: 커밋·푸시
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet -- viz/site data/macro.csv data/stocks.csv data/news.json; then
            echo "바뀐 페이지가 없습니다."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viz/site data/macro.csv
          # 주가·뉴스는 그날 소스가 막히면 파일 자체가 없을 수 있다 — 없는 경로를
          # add 하면 워크플로가 통째로 죽으므로 있을 때만 넣는다.
          for f in data/stocks.csv data/news.json; do
            [ -f "$f" ] && git add "$f"
          done
          MSG="데이터 갱신 — 기준일 ${ASOF:-미확인}"
          git commit -m "$MSG"
          # 그 사이 다른 워크플로(뉴스 갱신)나 사람이 밀었으면 bare push 는
          # non-fast-forward 로 죽는다(예전엔 여기서 조용히 멈췄다).
          # ⚠️ 예전엔 reset --soft 로 트리를 통째로 다시 썼는데, 그러면 이 실행이
          #    스테이지하지 않은 동시 변경(사람이 민 소스 등)을 base 판으로 되돌린다.
          #    rebase 는 '우리 커밋의 변경분'만 원격 tip 위에 얹어 동시 변경을 보존한다.
          #    충돌 파일(뉴스 등)은 우리가 방금 구운 산출물을 쓴다(-X theirs = 얹는 쪽).
          for i in 1 2 3 4 5 6; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "푸시 성공."
              exit 0
            fi
            [ "$i" -eq 6 ] && break
            echo "푸시 경합 — 원격 tip 위로 우리 커밋만 리베이스합니다 ($i/5)."
            # FETCH_HEAD 는 방금 받은 원격 브랜치 tip 을 확실히 가리킨다.
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase -X theirs FETCH_HEAD || git rebase --abort || true
            sleep $((i * 3))
          done
          echo "::error::데이터 갱신 커밋을 원격에 밀지 못했습니다."
          exit 1

      - name: 실패 알림 (조용히 멈추지 않게)
        # 자동화의 가장 큰 위험은 '조용히' 멈추는 것이다. 어느 단계든 실패하면
        # 열려 있는 알림 이슈에 덧붙이거나(없으면 새로 열어) 사람이 알게 한다.
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ 자동 갱신 실패 — ${context.workflow}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `\`${context.workflow}\` 워크플로가 실패했습니다.`,
              ``,
              `- 실행 로그: ${runUrl}`,
              `- 커밋: \`${context.sha}\``,
              `- 이벤트: \`${context.eventName}\``,
              ``,
              `데이터/사이트가 갱신·배포되지 않았을 수 있습니다. 위 로그에서 실패한 단계를 확인하세요.`,
            ].join('\n');
            const found = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title ${JSON.stringify(title)}`,
            });
            const existing = found.data.items.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
